<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artigo – Projeto Aster</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/leitura.css"><link rel="stylesheet" href="css/tema.css"><script src="js/tema.js"></script>
</head><body>
<article class="artigo" id="art"><p class="vazio">Carregando…</p></article>
<script type="module">
import { db } from './js/firebase-config.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { montarTopoRodape, esc, sanitizar, dataBonita } from './js/leitura.js';
import { marcarReferencias } from './js/versiculos.js';
montarTopoRodape();
const a=document.getElementById('art');
try{
  const id=new URLSearchParams(location.search).get('id');
  const s=id?await getDoc(doc(db,'noticias',id)):null;
  if(!s||!s.exists()||s.data().status!=='publicado'){a.innerHTML='<p class="vazio">Este artigo não existe ou ainda não foi publicado.</p>';}
  else{
    const n=s.data();document.title=n.titulo+' – Projeto Aster';
    a.innerHTML=(n.edicao?'<a class="voltar" href="edicoes.html">← Editorial</a><br>':'')+
      '<span class="cat">'+esc(n.categoria||'')+'</span><h1>'+esc(n.titulo)+'</h1>'+
      '<p class="meta">'+esc(n.autorNome||'')+(n.autorNome&&n.criadoEm?' · ':'')+esc(dataBonita(n.criadoEm))+'</p>'+
      (n.imagemUrl?'<img class="capa-img" src="'+esc(n.imagemUrl)+'" alt="">':'')+
      (n.resumo?'<p class="resumo">'+esc(n.resumo)+'</p>':'')+
      '<div class="corpo">'+sanitizar(n.conteudo)+'</div>';
    marcarReferencias(a.querySelector('.corpo'));
  }
}catch(err){a.innerHTML='<p class="vazio">Não foi possível carregar agora.</p>';console.error(err);}
</script></body></html>
