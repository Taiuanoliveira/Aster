<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipe – Painel Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../img/logo-192.png">
<meta name="theme-color" content="#0C3B5C">
<meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo"><img src="../img/logo.svg" alt="" width="26" height="26" style="vertical-align:middle;margin-right:8px">Projeto Aster</div>
      <p class="admin-cargo-label">Cargo: <strong id="cargoAtual">—</strong></p>
      <nav class="admin-nav" id="menuAdmin"></nav>
      <a href="../conta.html" class="admin-btn-sair" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px;">Meu Perfil</a>
      <button id="btnSair" class="admin-btn-sair">Sair</button>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <h1>Equipe</h1>
        <a href="../index.html" class="admin-link-site">Ver site →</a>
      </header>
      <section class="admin-bloco">
        <div id="msgSucesso" class="auth-msg sucesso" style="display:none;"></div>
        <div id="msgErro" class="auth-msg erro" style="display:none;"></div>
        <label>Nome</label>
        <input type="text" id="nome" placeholder="Ex: João Silva">
        <label>Cargo</label>
        <input type="text" id="cargo" placeholder="Ex: Editor-chefe">
        <label>Bio (opcional)</label>
        <textarea id="bio" rows="3" placeholder="Uma ou duas frases sobre a pessoa"></textarea>
        <label>Instagram (só o usuário, sem @)</label>
        <input type="text" id="insta" placeholder="ex: nomedapessoa">
        <label>WhatsApp (só números, com DDD)</label>
        <input type="text" id="zap" placeholder="ex: 75999990000">
        <label>E-mail</label>
        <input type="email" id="emailm" placeholder="ex: pessoa@email.com">
        <label>Site</label>
        <input type="text" id="sitem" placeholder="ex: https://site.com">
        <label>Ordem de exibição</label>
        <input type="number" id="ordem" value="1" min="1">
        <label>Foto</label>
        <input type="file" id="foto" accept="image/*">
        <div class="form-acoes">
          <button class="btn-primario" id="btnMembro" onclick="adicionarMembro()">Adicionar à equipe</button>
          <button type="button" id="btnCancelarMembro" onclick="cancelarMembro()" style="display:none;margin-left:10px;padding:10px 18px;background:none;border:1px solid #ccc;cursor:pointer;">Cancelar</button>
        </div>
      </section>
      <section class="admin-bloco">
        <h2 style="font-family:'Playfair Display',serif;font-size:18px;margin-bottom:8px;">Membros atuais</h2>
        <p style="font-size:13px;color:#777;margin-bottom:10px;">Quem recebe um cargo em <strong>Usuários</strong> entra aqui sozinho. Para trazer quem já tinha cargo antes, clique no botão.</p>
        <button class="btn-primario" style="margin-bottom:16px;" onclick="sincronizarTodos()">↻ Trazer quem já tem cargo</button>
        <div id="listaMembros">Carregando...</div>
      </section>
    </main>
  </div>
  <script type="module">
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    import { protegerPagina, sair, CARGOS } from "../js/auth.js";
    import { db } from "../js/firebase-config.js";
    import { collection, addDoc, getDocs, deleteDoc, doc, orderBy, query, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { enviarImagemCloudinary } from "../js/cloudinary.js";

    function montarMenu(cargo) {
      const itens = [
        { href: 'dashboard.html', label: '📊 Dashboard', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'publicar.html', label: '✍️ Novo Artigo', cargos: ['administrador','editor','colunista'] },
        { href: 'gerenciar-noticias.html', label: '📰 Gerenciar Artigos', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'categorias-admin.html', label: '🏷️ Categorias', cargos: ['administrador','editor'] },
        { href: 'tags-admin.html', label: '🔖 Tags e Destaques', cargos: ['administrador','editor'] },
        { href: 'edicoes-admin.html', label: '📚 Edições', cargos: ['administrador','editor'] },
        { href: 'conteudo-admin.html', label: '🧩 Conteúdo do site', cargos: ['administrador','editor'] },
        { href: 'conteudo-admin.html?aba=biblioteca', label: '📚 Biblioteca', cargos: ['administrador','editor'] },
        { href: 'estatisticas-admin.html', label: '📈 Estatísticas', cargos: ['administrador','editor'] },
        { href: 'equipe-admin.html', label: '👥 Equipe', cargos: ['administrador'] },
        { href: 'usuarios.html', label: '👤 Usuários', cargos: ['administrador'] },
        { href: 'planos-admin.html', label: '💳 Apoio', cargos: ['administrador'] },
        { href: 'configuracoes.html', label: '⚙️ Configurações', cargos: ['administrador'] },
      ];
      document.getElementById('menuAdmin').innerHTML = itens
        .filter(i => i.cargos.includes(cargo))
        .map(i => `<a href="${i.href}">${i.label}</a>`).join('');
    }

    function msg(id, texto) {
      const el = document.getElementById(id);
      el.textContent = texto;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    async function carregarMembros() {
      const lista = document.getElementById('listaMembros');
      const snap = await getDocs(query(collection(db, 'equipe'), orderBy('ordem')));
      if (snap.empty) { lista.innerHTML = '<p style="color:#777;font-size:13px;">Nenhum membro ainda.</p>'; return; }
      lista.innerHTML = '';
      snap.forEach(d => {
        const m = d.data();
        const div = document.createElement('div');
        div.style.cssText = 'display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #eee;';
        div.innerHTML = `
          ${m.fotoUrl ? `<img src="${esc(m.fotoUrl)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">` : '<div style="width:44px;height:44px;border-radius:50%;background:#eee;"></div>'}
          <div style="flex-grow:1;"><strong>${esc(m.nome)}</strong><div style="font-size:12px;color:#777;">${esc(m.cargo)} — posição ${esc(m.ordem)}</div></div>
          <button class="ed" style="background:none;border:none;color:#E8A33D;font-weight:700;font-size:12px;text-transform:uppercase;cursor:pointer;">Editar</button>
          <button class="rm" data-id="${d.id}" style="background:none;border:none;color:#b3261e;font-weight:700;font-size:12px;text-transform:uppercase;cursor:pointer;">Remover</button>
        `;
        div.querySelector('button.ed').onclick = () => editarMembro(d.id, m);
        div.querySelector('button.rm').onclick = async () => {
          if (confirm('Remover ' + m.nome + ' da equipe?')) {
            await deleteDoc(doc(db, 'equipe', d.id));
            carregarMembros();
          }
        };
        lista.appendChild(div);
      });
    }

    window.sincronizarTodos = async function () {
      const STAFF = ['administrador', 'editor', 'colunista', 'revisor'];
      const NOME = { administrador: 'Administrador', editor: 'Editor', colunista: 'Colunista', revisor: 'Revisor' };
      try {
        const us = await getDocs(collection(db, 'usuarios')); let novos = 0;
        for (const d of us.docs) {
          const u = d.data(); if (!STAFF.includes(u.cargo)) continue;
          const ref = doc(db, 'equipe', d.id), ex = await getDoc(ref);
          const dados = { uid: d.id, nome: u.nome || u.email || 'Sem nome', funcao: u.cargo, cargo: u.cargoEditorial || NOME[u.cargo] };
          if (u.fotoUrl) dados.fotoUrl = u.fotoUrl;
          if (!ex.exists()) { dados.ordem = Math.floor(Date.now() / 1000); if (u.bio) dados.bio = u.bio; novos++; }
          await setDoc(ref, dados, { merge: true });
        }
        msg('msgSucesso', novos + ' pessoa(s) adicionada(s) à equipe.'); carregarMembros();
      } catch (e) { msg('msgErro', 'Erro: ' + e.message); }
    };

    let editandoId = null;
    const gv = id => document.getElementById(id);
    window.cancelarMembro = function () {
      editandoId = null;
      ['nome', 'cargo', 'bio', 'insta', 'zap', 'emailm', 'sitem'].forEach(i => gv(i).value = '');
      gv('ordem').value = 1; gv('foto').value = '';
      gv('btnMembro').textContent = 'Adicionar à equipe'; gv('btnCancelarMembro').style.display = 'none';
    };
    window.editarMembro = function (id, m) {
      editandoId = id; const c = m.contatos || {};
      gv('nome').value = m.nome || ''; gv('cargo').value = m.cargo || ''; gv('ordem').value = m.ordem || 1; gv('bio').value = m.bio || '';
      gv('insta').value = c.instagram || ''; gv('zap').value = c.whatsapp || ''; gv('emailm').value = c.email || ''; gv('sitem').value = c.site || '';
      gv('btnMembro').textContent = 'Salvar alterações'; gv('btnCancelarMembro').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.adicionarMembro = async function () {
      const nome = gv('nome').value.trim(), cargo = gv('cargo').value.trim();
      const ordem = parseInt(gv('ordem').value) || 1, foto = gv('foto').files[0];
      if (!nome || !cargo) { msg('msgErro', 'Preencha nome e cargo.'); return; }
      const contatos = {};
      const ig = gv('insta').value.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/[^A-Za-z0-9._]/g, '');
      const zap = gv('zap').value.replace(/\D/g, ''), em = gv('emailm').value.trim();
      let site = gv('sitem').value.trim();
      if (site) site = 'https://' + site.replace(/^https?:\/\//i, '');
      if (ig) contatos.instagram = ig; if (zap) contatos.whatsapp = zap; if (em) contatos.email = em; if (site) contatos.site = site;
      try {
        const dados = { nome, cargo, ordem, bio: gv('bio').value.trim(), contatos, atualizadoEm: new Date().toISOString() };
        if (foto) dados.fotoUrl = await enviarImagemCloudinary(foto);
        if (editandoId) { await setDoc(doc(db, 'equipe', editandoId), dados, { merge: true }); msg('msgSucesso', nome + ' atualizado(a)!'); }
        else { if (!dados.fotoUrl) dados.fotoUrl = null; await addDoc(collection(db, 'equipe'), dados); msg('msgSucesso', nome + ' adicionado(a) à equipe!'); }
        window.cancelarMembro(); carregarMembros();
      } catch (e) { msg('msgErro', 'Erro: ' + e.message); }
    };

    protegerPagina([CARGOS.ADMIN], (user, cargo) => {
      document.getElementById('cargoAtual').textContent = cargo;
      montarMenu(cargo);
      carregarMembros();
    });

    document.getElementById('btnSair').addEventListener('click', async () => {
      await sair(); window.location.href = '../index.html';
    });
  </script>
<script src="../js/dica-imagem.js"></script>
</body>
</html>
