<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de leitura – Projeto Aster</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--esc:#0C3B5C;--med:#1F5A82;--azul:#B8E8FF;--amar:#E8A33D;--bg:#FBFAF6;--texto:#1a1a1a;--cinza:#666;--card:#fff;--borda:#e3ddd0}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0f1720;--texto:#e7edf3;--cinza:#9fb0bd;--card:#1b2430;--borda:#2a3442;--azul:#163049}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,sans-serif;background:var(--bg);color:var(--texto);padding-bottom:60px}
  a{color:inherit}
  header.topo{background:var(--esc);display:flex;align-items:center;justify-content:space-between;padding:18px 40px;flex-wrap:wrap;gap:12px}
  .logo-aster{display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:#fff;text-decoration:none}
  .logo-aster .estrela{color:var(--amar)}
  nav.nav-topo a{color:#dfeaf2;text-decoration:none;font-size:14px;font-weight:500;margin-left:20px}
  nav.nav-topo a:hover{color:var(--amar)}

  main{max-width:680px;margin:0 auto;padding:40px 20px}
  h1{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:6px}
  .sub{color:var(--cinza);font-size:14px;margin-bottom:24px}

  .tabs{display:flex;gap:10px;margin-bottom:20px}
  .tab{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--borda);background:transparent;cursor:pointer;color:var(--texto)}
  .tab.ativa{background:var(--amar);color:var(--esc);border-color:var(--amar)}

  .progresso-wrap{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:18px 20px;margin-bottom:20px}
  .progresso-topo{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--cinza)}
  .barra{height:8px;background:var(--borda);border-radius:999px;overflow:hidden}
  .barra-fill{height:100%;background:var(--amar);width:0%;transition:width .3s}

  .dia{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:12px 16px;margin-bottom:8px}
  .dia.feito{opacity:.55}
  .dia input{width:20px;height:20px;accent-color:var(--amar);cursor:pointer;flex-shrink:0}
  .dia .n{font-size:12px;color:var(--cinza);min-width:56px}
  .dia .t{font-size:14px;flex:1}
  .dia.feito .t{text-decoration:line-through}

  #listaDias{max-height:none}
</style>
</head>
<body>

<header class="topo">
  <a href="index.html" class="logo-aster"><span class="estrela">✦</span> Projeto Aster</a>
  <nav class="nav-topo">
    <a href="biblia.html">Bíblia</a>
    <a href="estudos.html">Estudos</a>
  </nav>
</header>

<main>
  <h1>Plano de leitura</h1>
  <p class="sub">A Bíblia em um ano ou em 90 dias. Seu progresso fica salvo neste navegador.</p>

  <div class="tabs">
    <button class="tab ativa" data-plano="365">Em 1 ano</button>
    <button class="tab" data-plano="90">Em 90 dias</button>
  </div>

  <div class="progresso-wrap">
    <div class="progresso-topo"><span id="progTexto">0 de 0 dias lidos</span><span id="progPct">0%</span></div>
    <div class="barra"><div class="barra-fill" id="barraFill"></div></div>
  </div>

  <div id="listaDias"></div>
</main>

<script>
const LIVROS = [["Gênesis",50],["Êxodo",40],["Levítico",27],["Números",36],["Deuteronômio",34],["Josué",24],["Juízes",21],["Rute",4],["1 Samuel",31],["2 Samuel",24],["1 Reis",22],["2 Reis",25],["1 Crônicas",29],["2 Crônicas",36],["Esdras",10],["Neemias",13],["Ester",10],["Jó",42],["Salmos",150],["Provérbios",31],["Eclesiastes",12],["Cantares",8],["Isaías",66],["Jeremias",52],["Lamentações",5],["Ezequiel",48],["Daniel",12],["Oseias",14],["Joel",3],["Amós",9],["Obadias",1],["Jonas",4],["Miqueias",7],["Naum",3],["Habacuque",3],["Sofonias",3],["Ageu",2],["Zacarias",14],["Malaquias",4],["Mateus",28],["Marcos",16],["Lucas",24],["João",21],["Atos",28],["Romanos",16],["1 Coríntios",16],["2 Coríntios",13],["Gálatas",6],["Efésios",6],["Filipenses",4],["Colossenses",4],["1 Tessalonicenses",5],["2 Tessalonicenses",3],["1 Timóteo",6],["2 Timóteo",4],["Tito",3],["Filemom",1],["Hebreus",13],["Tiago",5],["1 Pedro",5],["2 Pedro",3],["1 João",5],["2 João",1],["3 João",1],["Judas",1],["Apocalipse",22]];

const CAPITULOS = [];
LIVROS.forEach(([nome, n]) => { for (let i = 1; i <= n; i++) CAPITULOS.push(nome + " " + i); });

function gerarPlano(dias) {
  const porDia = Math.ceil(CAPITULOS.length / dias);
  const plano = [];
  for (let d = 0; d < dias; d++) {
    const trecho = CAPITULOS.slice(d * porDia, (d + 1) * porDia);
    if (trecho.length) plano.push(trecho);
  }
  return plano;
}

const PLANOS = { 365: gerarPlano(365), 90: gerarPlano(90) };

function chaveProgresso(tipo) { return 'aster_plano_' + tipo; }
function carregarProgresso(tipo) { return JSON.parse(localStorage.getItem(chaveProgresso(tipo)) || '{}'); }
function salvarProgresso(tipo, dados) { localStorage.setItem(chaveProgresso(tipo), JSON.stringify(dados)); }

let planoAtual = '365';

function render() {
  const plano = PLANOS[planoAtual];
  const progresso = carregarProgresso(planoAtual);
  const lista = document.getElementById('listaDias');
  lista.innerHTML = '';

  let feitos = 0;
  plano.forEach((trecho, i) => {
    const dia = i + 1;
    const marcado = !!progresso[dia];
    if (marcado) feitos++;
    const div = document.createElement('div');
    div.className = 'dia' + (marcado ? ' feito' : '');
    div.innerHTML = `<input type="checkbox" ${marcado ? 'checked' : ''} data-dia="${dia}"><span class="n">Dia ${dia}</span><span class="t">${trecho[0]}${trecho.length > 1 ? ' – ' + trecho[trecho.length-1] : ''}</span><a href="biblia.html" style="font-size:12px;color:var(--amar);text-decoration:none;white-space:nowrap">Ler →</a>`;
    lista.appendChild(div);
  });

  const pct = Math.round((feitos / plano.length) * 100);
  document.getElementById('progTexto').textContent = feitos + ' de ' + plano.length + ' dias lidos';
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('barraFill').style.width = pct + '%';

  lista.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const progresso = carregarProgresso(planoAtual);
      const dia = cb.dataset.dia;
      if (cb.checked) progresso[dia] = true; else delete progresso[dia];
      salvarProgresso(planoAtual, progresso);
      render();
    });
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativa'));
    tab.classList.add('ativa');
    planoAtual = tab.dataset.plano;
    render();
  });
});

render();
</script>
</body>
</html>
