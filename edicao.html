<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edição – Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0C3B5C">
<meta name="description" content="Leia as matérias desta edição do Projeto Aster.">
<meta property="og:site_name" content="Projeto Aster">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Edição – Projeto Aster">
<meta property="og:description" content="Leia as matérias desta edição do Projeto Aster.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/leitura.css"><link rel="stylesheet" href="css/tema.css"><script src="js/tema.js"></script>
<link rel="stylesheet" href="css/carrossel.css">
</head><body>
<section class="faixa"><p class="rot" id="tema">Edição</p><h1 id="nome">Carregando…</h1><p class="sub" id="desc"></p></section>
<main class="pag" style="max-width:1040px"><a class="voltar" href="edicoes.html">← Todas as edições</a><div id="conteudo"></div></main>
<script type="module">
import { db } from './js/firebase-config.js';
import { doc, getDoc, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { montarTopoRodape, esc, sanitizar } from './js/leitura.js';
import { marcarReferencias } from './js/versiculos.js';
montarTopoRodape();
const $=id=>document.getElementById(id), c=$('conteudo');
try{
  const id=new URLSearchParams(location.search).get('id');
  const s=id?await getDoc(doc(db,'edicoes',id)):null;
  if(!s||!s.exists()||s.data().status!=='publicada'){$('nome').textContent='Edição não encontrada';c.innerHTML='<p class="vazio">Esta edição não existe ou ainda não foi publicada.</p>';}
  else{
    const e=s.data();document.title=e.nome+' – Projeto Aster';
    $('tema').textContent=(e.numero?'Edição nº '+e.numero:'Edição')+(e.especial?' · Especial':'')+(e.tema?' · '+e.tema:'');$('nome').textContent=e.nome;$('desc').textContent=e.descricao||'';
    let h='';
    if(e.cartaLeitor&&e.cartaLeitor.replace(/<[^>]*>/g,'').trim())h+='<div class="carta"><h2>Carta ao leitor</h2><div class="corpo">'+sanitizar(e.cartaLeitor)+'</div></div>';
    const porStatus=st=>getDocs(query(collection(db,'noticias'),where('edicao','==',e.nome),where('status','==',st)));
    const [qa,qb]=await Promise.all([porStatus('publicado'),porStatus('indexado')]);
    const q={docs:[...qa.docs,...qb.docs]};
    const acesso=n=>'';
    const m=q.docs.map(d=>({id:d.id,...d.data()})).filter(n=>n.status==='publicado'||n.status==='indexado').sort((a,b)=>(a.ordemEdicao||99)-(b.ordemEdicao||99));
    h+='<h2 class="sec">Nesta edição</h2>';
    const cartao=(n,i)=>'<a class="of-card'+(i===0?' of-capa':'')+'" href="noticia.html?id='+encodeURIComponent(n.id)+'"><div class="of-img">'+(n.imagemUrl?'<img src="'+esc(n.imagemUrl)+'" alt="">':'<div class="sem-img">✦</div>')+'</div><div class="of-txt"><small class="selo">'+(i===0?'Matéria de capa':esc(n.categoria||''))+'</small><h3>'+esc(n.titulo)+acesso(n)+'</h3><p>'+esc(n.resumo||'')+'</p><span class="of-aut">'+esc([n.autorNome].concat(n.coautores||[]).filter(Boolean).join(', '))+'</span></div></a>';
    h+=m.length?'<div class="of-grade">'+m.map(cartao).join('')+'</div>':'<p class="vazio">Os artigos desta edição serão publicados em breve.</p>';
    c.innerHTML=h;
    c.querySelectorAll('.corpo').forEach(marcarReferencias);
  }
}catch(err){$('nome').textContent='Erro ao carregar';c.innerHTML='<p class="vazio">Não foi possível carregar agora.</p>';console.error(err);}
</script></body></html>
