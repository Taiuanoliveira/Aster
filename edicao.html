<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edição – Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="img/logo-192.png">
<meta name="theme-color" content="#3056FF">
<meta name="description" content="Leia as matérias desta edição do Projeto Aster.">
<meta property="og:site_name" content="Projeto Aster">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Edição – Projeto Aster">
<meta property="og:description" content="Leia as matérias desta edição do Projeto Aster.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/leitura.css"><link rel="stylesheet" href="css/tema.css"><script src="js/tema.js"></script>
<link rel="stylesheet" href="css/carrossel.css">
</head><body>
<section class="faixa"><p class="rot" id="tema">Edição</p><h1 id="nome">Carregando…</h1><p class="sub" id="desc"></p></section>
<main class="pag" style="max-width:1040px"><a class="voltar" href="edicoes.html">← Todas as edições</a><div id="conteudo"></div></main>
<script type="module">
import { db } from './js/firebase-config.js';
import { doc, getDoc, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { montarTopoRodape, esc, sanitizar } from './js/leitura.js';
import { marcarReferencias } from './js/versiculos.js';
import { ordenarMaterias } from './js/fluxo-edicao.js';
montarTopoRodape();
const $=id=>document.getElementById(id), c=$('conteudo');
try{
  const id=new URLSearchParams(location.search).get('id');
  const dm=(id&&id.indexOf('demo-')===0)?await (await import('./js/demo.js')).carregarDemo():null;
  let s=null;
  if(dm){const de=dm.edicao(id); s=de?{exists:()=>true,id:de.id,data:()=>de}:null;}
  else if(id){try{s=await getDoc(doc(db,'edicoes',id));}catch(e){s=null;}}
  if(!s||!s.exists()||s.data().status!=='publicada'){$('nome').textContent='Edição não encontrada';c.innerHTML='<p class="vazio">Esta edição não existe ou ainda não foi publicada.</p>';}
  else{
    const e=s.data();document.title=e.nome+' – Projeto Aster';
    $('tema').textContent=(e.numero?'Edição nº '+e.numero:'Edição')+(e.especial?' · Especial':'')+(e.tema?' · '+e.tema:'');$('nome').textContent=e.nome;$('desc').textContent=e.descricao||'';
    let h='';
    const cartaHtml=(e.cartaLeitor&&e.cartaLeitor.replace(/<[^>]*>/g,'').trim())?'<div class="carta"><h2>Carta ao leitor</h2><div class="corpo">'+sanitizar(e.cartaLeitor)+'</div></div>':'';
    const porStatus=st=>getDocs(query(collection(db,'noticias'),where('edicao','==',e.nome),where('status','==',st)));
    const [qa,qb]=dm?[{docs:[]},{docs:[]}]:await Promise.all([porStatus('publicado'),porStatus('indexado')]);
    const q=dm?{docs:dm.artigosDaEdicao(id).map(a=>{const {id:i,...r}=a;return {id:i,data:()=>r};})}:{docs:[...qa.docs,...qb.docs]};
    const m=ordenarMaterias(q.docs.map(d=>({id:d.id,...d.data()})).filter(n=>n.status==='publicado'||n.status==='indexado'));
    const cartao=(n,i)=>'<a class="of-card'+(i===0?' of-capa':'')+'" href="noticia.html?id='+encodeURIComponent(n.id)+'"><div class="of-img">'+(n.imagemUrl?'<img src="'+esc(n.imagemUrl)+'" alt="">':'<div class="sem-img">✦</div>')+'</div><div class="of-txt"><small class="selo">'+(n.materiaCapa?'Matéria de capa':esc(n.categoria||''))+'</small><h3>'+esc(n.titulo)+'</h3><p>'+esc(n.resumo||'')+'</p><span class="of-aut">'+esc([n.autorNome].concat(n.coautores||[]).filter(Boolean).join(', '))+'</span></div></a>';
    if(m.length){
      h+='<h2 class="sec">Nesta edição</h2><div class="of-grade">'+cartao(m[0],0)+'</div>'+cartaHtml;
      if(m.length>1)h+='<div class="of-grade" style="margin-top:34px">'+m.slice(1).map((n,i)=>cartao(n,i+1)).join('')+'</div>';
    }else h+=cartaHtml+'<h2 class="sec">Nesta edição</h2><p class="vazio">Os artigos desta edição serão publicados em breve.</p>';
    c.innerHTML=h;
    try{
      const todas=(dm?dm.edicoes.slice():(await getDocs(query(collection(db,'edicoes'),where('status','==','publicada')))).docs.map(x=>({id:x.id,...x.data()})))
        .sort((a,b)=>String(a.publicadaEm||a.criadoEm||'').localeCompare(String(b.publicadaEm||b.criadoEm||'')));
      const i=todas.findIndex(x=>x.id===id), ant=todas[i-1], prox=todas[i+1];
      const nav=document.createElement('nav'); nav.className='nav-edicoes'; nav.setAttribute('aria-label','Outras edições');
      nav.innerHTML=(ant?'<a href="edicao.html?id='+encodeURIComponent(ant.id)+'">← '+esc(ant.nome)+'</a>':'<span></span>')+
        '<button type="button" id="btnCompEd">Compartilhar edição</button>'+
        (prox?'<a href="edicao.html?id='+encodeURIComponent(prox.id)+'">'+esc(prox.nome)+' →</a>':'<span></span>');
      c.appendChild(nav);
      document.getElementById('btnCompEd').addEventListener('click',()=>{
        const url=location.href.split('#')[0];
        if(navigator.share){navigator.share({title:e.nome+' – Projeto Aster',url}).catch(()=>{});}
        else if(navigator.clipboard){navigator.clipboard.writeText(url).then(()=>{document.getElementById('btnCompEd').textContent='Link copiado!';}).catch(()=>{});}
      });
    }catch(err){}
    c.querySelectorAll('.corpo').forEach(marcarReferencias);
  }
}catch(err){$('nome').textContent='Erro ao carregar';c.innerHTML='<p class="vazio">Não foi possível carregar agora.</p>';console.error(err);}
</script></body></html>
