<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artigo – Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0C3B5C">
<meta name="description" content="Leia este artigo no Projeto Aster.">
<meta property="og:site_name" content="Projeto Aster">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Artigo – Projeto Aster">
<meta property="og:description" content="Leia este artigo no Projeto Aster.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/leitura.css"><link rel="stylesheet" href="css/tema.css"><script src="js/tema.js"></script>
</head><body>
<article class="artigo" id="art"><p class="vazio">Carregando…</p></article>
<script type="module">
import { montarFerramentas } from './js/ferramentas-artigo.js';
import { db } from './js/firebase-config.js';
import { doc, getDoc, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { montarTopoRodape, esc, sanitizar, dataBonita, dataHoraBonita, trilhaHTML } from './js/leitura.js';
import { marcarReferencias } from './js/versiculos.js';
import { observarLogin } from './js/auth.js';
import {
  registrarVisualizacao, curtidaDoUsuario, contarCurtidas, alternarCurtida,
  estaSalvoParaDepois, alternarSalvarParaDepois,
  criarComentario, listarComentarios, excluirComentario
} from './js/interacoes.js';

montarTopoRodape();
const a = document.getElementById('art');
let noticiaId = null;
let noticiaDados = null;
let usuarioAtual = null;
let bloqueado = false;
let regra = '2-paragrafos';

try {
  const id = new URLSearchParams(location.search).get('id');
  const dm = (id && id.indexOf('demo-') === 0) ? await (await import('./js/demo.js')).carregarDemo() : null;
  const sd = dm ? dm.artigo(id) : null;
  const s = dm ? { exists: () => !!sd, data: () => sd } : (id ? await getDoc(doc(db, 'noticias', id)) : null);
  let edOk = true;
  if (!dm && s && s.exists() && s.data().edicao) {
    try { edOk = !(await getDocs(query(collection(db, 'edicoes'), where('nome', '==', s.data().edicao), where('status', '==', 'publicada')))).empty; } catch (e) { edOk = false; }
  }
  if (!s || !s.exists() || !['publicado', 'indexado'].includes(s.data().status) || !edOk) {
    a.innerHTML = '<p class="vazio">Este artigo não existe ou ainda não foi publicado.</p>';
  } else {
    noticiaId = id;
    noticiaDados = s.data();
    const n = noticiaDados;
    document.title = n.titulo + ' – Projeto Aster';
    { const d = String(n.resumo || '').slice(0, 160);
      const set = (s, v) => { const e = document.querySelector(s); if (e) e.setAttribute('content', v); };
      set('meta[name="description"]', d || 'Leia este artigo no Projeto Aster.'); set('meta[property="og:title"]', n.titulo); set('meta[property="og:description"]', d);
      if (n.imagemUrl) { let m = document.querySelector('meta[property="og:image"]'); if (!m) { m = document.createElement('meta'); m.setAttribute('property', 'og:image'); document.head.appendChild(m); } m.setAttribute('content', n.imagemUrl); } }
    let edicaoDoc = null;
    if (dm && n.edicao) { edicaoDoc = dm.edicaoPorNome(n.edicao); }
    else if (n.edicao) {
      try {
        const qs = await getDocs(query(collection(db, 'edicoes'), where('nome', '==', n.edicao), where('status', '==', 'publicada')));
        const d0 = qs.docs.find(x => x.data().status === 'publicada');
        if (d0) edicaoDoc = { id: d0.id, ...d0.data() };
      } catch (e) {}
    }
    regra = (n.paywallOverride && n.paywallOverride !== 'sempre-liberado') ? n.paywallOverride : '2-paragrafos';
    bloqueado = false; // conteúdo gratuito; apoio voluntário em apoiar.html
    const trilhaPartes = [{ texto: 'Início', href: 'index.html' }];
    if (n.edicao) {
      trilhaPartes.push({ texto: 'Editorial', href: 'edicoes.html' });
      trilhaPartes.push({ texto: n.edicao, href: edicaoDoc ? 'edicao.html?id=' + encodeURIComponent(edicaoDoc.id) : 'edicoes.html' });
    } else {
      trilhaPartes.push({ texto: 'Artigos', href: 'artigos.html' });
    }
    trilhaPartes.push({ texto: n.titulo });
    const nomesAutor = [n.autorNome].concat(n.coautores || []).filter(Boolean).join(', ');
    const minLeitura = Math.max(1, Math.round(String(n.conteudo || '').replace(/<[^>]*>/g, ' ').split(/\s+/).filter(Boolean).length / 200));
    a.innerHTML = trilhaHTML(trilhaPartes) +
      (n.imagemUrl ? '<figure class="capa-fig"><img class="capa-img" src="' + esc(n.imagemUrl) + '" alt="' + esc(n.imagemLegenda || '') + '">' + (n.imagemLegenda ? '<figcaption>' + esc(n.imagemLegenda) + '</figcaption>' : '') + '</figure>' : '') +
      '<span class="cat">' + esc(n.categoria || '') + '</span><h1>' + esc(n.titulo) + '</h1>' +
      '<hr class="linha-fina">' +
      '<div class="byline" id="byline"><div class="av" id="bylineAv">' + esc((nomesAutor || '?').charAt(0).toUpperCase()) + '</div><div class="info"><strong>' + esc(nomesAutor) + '</strong>' + esc(dataHoraBonita(n.criadoEm)) + (n.criadoEm ? ' · ' : '') + minLeitura + ' min de leitura</div></div>' +
      '<div class="toolbar-art" id="toolbarArt"></div>' +
      (n.resumo ? '<p class="resumo">' + esc(n.resumo) + '</p>' : '') +
      '<div class="corpo" id="corpoArt">' + sanitizar(bloqueado ? cortar(n.conteudo, regra) : n.conteudo) + '</div>' + (bloqueado ? gateHTML(false) : '') +
      '<div class="acoes-art" id="acoesArt">' +
        '<button class="btn-acao" id="btnCurtir">🤍 Curtir <span class="n" id="numCurtidas">0</span></button>' +
        '<button class="btn-acao" id="btnSalvar">🔖 Salvar</button>' +
      '</div>' +
      '<section class="comentarios" id="secComentarios">' +
        '<h2>Comentários</h2>' +
        '<div id="areaFormComentario"></div>' +
        '<div id="listaComentarios">Carregando comentários…</div>' +
      '</section>';
    marcarReferencias(a.querySelector('.corpo'));
    try { if (!sessionStorage.getItem('aster_v_' + noticiaId)) { sessionStorage.setItem('aster_v_' + noticiaId, '1'); try { if (!sessionStorage.getItem('aster_v_' + noticiaId)) { sessionStorage.setItem('aster_v_' + noticiaId, '1'); registrarVisualizacao(noticiaId); } } catch (e) { registrarVisualizacao(noticiaId); } } } catch (e) { registrarVisualizacao(noticiaId); }
    montarFerramentas(n.titulo);
    if (dm) iniciarDemo(); else iniciarAcoes();
    if (!dm) carregarFotoAutor(n.autorUid, n.autorNome);
    montarNavMateria(n);
  }
} catch (err) {
  a.innerHTML = '<p class="vazio">Não foi possível carregar agora.</p>';
  console.error(err);
}

async function montarNavMateria(n) {
  if (!n.edicao) return;
  try {
    const por = st => getDocs(query(collection(db, 'noticias'), where('edicao', '==', n.edicao), where('status', '==', st)));
    const [qa, qb] = await Promise.all([por('publicado'), por('indexado')]);
    const lista = [...qa.docs, ...qb.docs].map(d => ({ id: d.id, ...d.data() })).sort((x, y) => (x.ordemEdicao ?? 99) - (y.ordemEdicao ?? 99));
    const i = lista.findIndex(x => x.id === noticiaId);
    if (i < 0 || lista.length < 2) return;
    const ant = lista[i - 1], prox = lista[i + 1];
    const nav = document.createElement('nav');
    nav.className = 'nav-materias'; nav.setAttribute('aria-label', 'Outras matérias da edição');
    nav.innerHTML = '<span>' + (ant ? '<a href="noticia.html?id=' + encodeURIComponent(ant.id) + '">← ' + esc(ant.titulo) + '</a>' : '') + '</span>' +
                    '<span>' + (prox ? '<a href="noticia.html?id=' + encodeURIComponent(prox.id) + '">' + esc(prox.titulo) + ' →</a>' : '') + '</span>';
    const ref = document.getElementById('acoesArt');
    if (ref) ref.after(nav);
  } catch (e) {}
}

async function carregarFotoAutor(autorUid, autorNome) {
  try {
    let foto = '';
    if (autorUid) {
      const s = await getDoc(doc(db, 'equipe', autorUid));
      if (s.exists() && s.data().fotoUrl) foto = s.data().fotoUrl;
    }
    if (!foto && autorNome) {
      const q = await getDocs(query(collection(db, 'equipe'), where('nome', '==', autorNome)));
      const m = q.docs.map(d => d.data()).find(x => x.fotoUrl);
      if (m) foto = m.fotoUrl;
    }
    if (foto) {
      const av = document.getElementById('bylineAv');
      if (av) av.outerHTML = '<img class="av" id="bylineAv" src="' + esc(foto) + '" alt="">';
    }
  } catch (e) {}
}

function cortar(html, r) {
  const d = new DOMParser().parseFromString('<div>' + (html || '') + '</div>', 'text/html');
  const blocos = Array.from(d.body.firstChild.children);
  const manter = r === '3-paragrafos' ? 3 : r === '50-porcento' ? Math.max(1, Math.floor(blocos.length / 2)) : 2;
  blocos.slice(manter).forEach(b => b.remove());
  return d.body.firstChild.innerHTML;
}
function gateHTML(logado) {
  return '<div class="gate" id="gate"><h3>🔒 Continue lendo com uma assinatura</h3>' + (logado
    ? '<p>Sua conta ainda não tem uma assinatura ativa. Fale com a equipe do Projeto Aster para liberar o conteúdo completo.</p><a href="conta.html">Minha conta</a>'
    : '<p>Este artigo faz parte do conteúdo para assinantes. Entre na sua conta para continuar.</p><a href="login.html">Entrar</a><a class="sec2" href="cadastro.html">Criar conta</a>') + '</div>';
}
async function liberarSeAssinante(user) {
  if (!bloqueado) return;
  const g = document.getElementById('gate');
  if (!user) return;
  let ok = false;
  try {
    const u = await getDoc(doc(db, 'usuarios', user.uid));
    const d = u.exists() ? u.data() : {};
    ok = ['administrador', 'editor', 'colunista', 'revisor'].includes(d.cargo) || !!(d.premiumAte && d.premiumAte >= new Date().toISOString().slice(0, 10));
  } catch (e) {}
  if (ok) {
    const c = document.getElementById('corpoArt');
    c.innerHTML = sanitizar(noticiaDados.conteudo);
    marcarReferencias(c);
    if (g) g.remove();
    bloqueado = false;
  } else if (g) {
    g.outerHTML = gateHTML(true);
  }
}
function iniciarDemo() {
  const av = () => alert('Este é um artigo de exemplo. Curtir, salvar e comentar funcionam nos artigos reais.');
  ['btnCurtir', 'btnSalvar'].forEach(i => document.getElementById(i).addEventListener('click', av));
  document.getElementById('areaFormComentario').innerHTML = '<p class="comentario-login">Os comentários ficam disponíveis nos artigos reais.</p>';
  document.getElementById('listaComentarios').innerHTML = '';
}
function iniciarAcoes() {
  observarLogin(async (user) => {
    usuarioAtual = user;
    await liberarSeAssinante(user);
    await atualizarCurtida();
    await atualizarSalvo();
    montarFormComentario();
    carregarComentarios();
  });

  document.getElementById('btnCurtir').addEventListener('click', async () => {
    if (!usuarioAtual) { avisarLogin(); return; }
    await alternarCurtida(noticiaId, usuarioAtual.uid);
    atualizarCurtida();
  });

  document.getElementById('btnSalvar').addEventListener('click', async () => {
    if (!usuarioAtual) { avisarLogin(); return; }
    const salvo = await alternarSalvarParaDepois(noticiaId, usuarioAtual.uid, {
      titulo: noticiaDados.titulo, imagemUrl: noticiaDados.imagemUrl || '', categoria: noticiaDados.categoria || ''
    });
    marcarBotaoSalvar(salvo);
  });
}

function avisarLogin() {
  if (confirm('Você precisa entrar na sua conta para fazer isso. Ir para a tela de login?')) {
    location.href = 'login.html';
  }
}

async function atualizarCurtida() {
  const total = await contarCurtidas(noticiaId);
  document.getElementById('numCurtidas').textContent = total;
  if (usuarioAtual) {
    const curtiu = await curtidaDoUsuario(noticiaId, usuarioAtual.uid);
    marcarBotaoCurtir(curtiu);
  }
}

function marcarBotaoCurtir(curtiu) {
  const btn = document.getElementById('btnCurtir');
  btn.classList.toggle('ativo', curtiu);
  btn.innerHTML = (curtiu ? '❤️' : '🤍') + ' Curtir <span class="n" id="numCurtidas">' + document.getElementById('numCurtidas').textContent + '</span>';
}

async function atualizarSalvo() {
  if (!usuarioAtual) return;
  const salvo = await estaSalvoParaDepois(noticiaId, usuarioAtual.uid);
  marcarBotaoSalvar(salvo);
}

function marcarBotaoSalvar(salvo) {
  const btn = document.getElementById('btnSalvar');
  btn.classList.toggle('ativo', salvo);
  btn.innerHTML = (salvo ? '✅ Salvo' : '🔖 Salvar');
}

function montarFormComentario() {
  const area = document.getElementById('areaFormComentario');
  if (!usuarioAtual) {
    area.innerHTML = '<p class="comentario-login">Para comentar, <a href="login.html">entre na sua conta</a>.</p>';
    return;
  }
  area.innerHTML =
    '<div class="form-comentario">' +
      '<textarea id="campoComentario" placeholder="Escreva um comentário..."></textarea>' +
      '<div class="acoes-form"><button id="btnEnviarComentario">Comentar</button></div>' +
    '</div>';
  document.getElementById('btnEnviarComentario').addEventListener('click', async () => {
    const texto = document.getElementById('campoComentario').value.trim();
    if (!texto) return;
    await criarComentario(noticiaId, usuarioAtual.uid, usuarioAtual.displayName || 'Leitor', texto);
    document.getElementById('campoComentario').value = '';
    carregarComentarios();
  });
}

async function carregarComentarios() {
  const lista = document.getElementById('listaComentarios');
  try {
    const comentarios = await listarComentarios(noticiaId);
    if (!comentarios.length) {
      lista.innerHTML = '<p class="sem-comentarios">Nenhum comentário ainda. Seja o primeiro a comentar.</p>';
      return;
    }
    lista.innerHTML = comentarios.map(c => {
      const podeExcluir = usuarioAtual && (usuarioAtual.uid === c.autorUid);
      return '<div class="comentario">' +
        '<div class="cab"><span class="autor">' + esc(c.autorNome || 'Leitor') + '</span><span class="data">' + esc(dataBonita(c.criadoEm)) + '</span></div>' +
        '<p>' + esc(c.texto) + '</p>' +
        (podeExcluir ? '<button class="excluir" data-id="' + c.id + '">Excluir</button>' : '') +
      '</div>';
    }).join('');
    lista.querySelectorAll('.excluir').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (confirm('Excluir este comentário?')) {
          await excluirComentario(noticiaId, btn.dataset.id);
          carregarComentarios();
        }
      });
    });
  } catch (e) {
    lista.innerHTML = '<p class="sem-comentarios">Não foi possível carregar os comentários agora.</p>';
  }
}
</script></body></html>
