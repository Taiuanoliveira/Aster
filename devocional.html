<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devocional diário – Projeto Aster</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--esc:#0C3B5C;--med:#1F5A82;--azul:#B8E8FF;--amar:#E8A33D;--bg:#FBFAF6;--texto:#1a1a1a;--cinza:#666;--card:#fff;--borda:#e3ddd0}
  
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,sans-serif;background:var(--bg);color:var(--texto);padding-bottom:60px}
  a{color:inherit}
  header.topo{background:var(--esc);display:flex;align-items:center;justify-content:space-between;padding:18px 40px;flex-wrap:wrap;gap:12px}
  .logo-aster{display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:#fff;text-decoration:none}
  .logo-aster .estrela{color:var(--amar)}
  nav.nav-topo a{color:#dfeaf2;text-decoration:none;font-size:14px;font-weight:500;margin-left:20px}
  nav.nav-topo a:hover{color:var(--amar)}

  main{max-width:620px;margin:0 auto;padding:40px 20px}
  .data{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--amar);margin-bottom:10px}
  .card-dia{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:30px}
  .card-dia h1{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:14px;color:var(--esc)}
  
  .card-dia .ref{font-size:13px;color:var(--med);font-weight:600;margin-bottom:18px}
  .card-dia p{font-size:15px;line-height:1.8;margin-bottom:14px}
  .acoes{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer}
  .btn-amar{background:var(--amar);color:var(--esc)}
  .btn-outline{background:transparent;border:1px solid var(--borda);color:var(--texto)}

  .anteriores{margin-top:30px}
  .anteriores h2{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:12px}
  .mini{background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:14px 16px;margin-bottom:8px;font-size:13px}
  .mini .d{color:var(--cinza);font-size:11px;margin-bottom:3px}
</style>
<link rel="stylesheet" href="css/tema.css">
<script src="js/tema.js"></script>
</head>
<body>

<header class="topo">
  <a href="index.html" class="logo-aster"><span class="estrela">✦</span> Projeto Aster</a>
  <nav class="nav-topo">
    <a href="biblia.html">Bíblia</a>
    <a href="edicoes.html">Editorial</a><a href="artigos.html">Artigos</a>
    <a href="estudos.html">Estudos</a>
    <a href="biblioteca.html">Biblioteca</a>
    <a href="login.html">Entrar</a>
  </nav>
</header>

<main>
  <p class="data" id="dataAtual"></p>
  <div class="card-dia" id="cardHoje"></div>

  <div class="anteriores">
    <h2>Dias anteriores</h2>
    <div id="listaAnteriores"></div>
  </div>
</main>

<script type="module">
let lerColecao = async () => [];
try { ({ lerColecao } = await import('./js/conteudo.js')); } catch (e) {}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEVOCIONAIS = [
  { ref:"Salmos 23:1", titulo:"O Pastor que não falta", texto:"\"O Senhor é o meu pastor, nada me faltará.\" Não é uma promessa de que tudo vai ser fácil, é a certeza de que, no essencial, você não caminha abandonado. Hoje, troque a preocupação pelo lembrete de que existe Alguém cuidando dos detalhes." },
  { ref:"Isaías 41:10", titulo:"Não temas", texto:"\"Não temas, porque eu sou contigo.\" O medo encolhe diante de uma presença maior. Não é a ausência de desafios que traz paz, é saber que você não os enfrenta sozinho." },
  { ref:"Provérbios 3:5-6", titulo:"Confiar sem entender tudo", texto:"\"Confia no Senhor de todo o teu coração, e não te estribes no teu próprio entendimento.\" Às vezes a maturidade de fé não é ter todas as respostas, é confiar mesmo sem elas." },
  { ref:"Mateus 11:28", titulo:"Vinde a mim", texto:"\"Vinde a mim todos os que estais cansados e oprimidos, e eu vos aliviarei.\" O convite não é para os fortes, é para os cansados. Hoje, se o peso está grande, esse é o momento de descansar nele." },
  { ref:"Filipenses 4:13", titulo:"Força para hoje", texto:"\"Tudo posso naquele que me fortalece.\" Não é uma fórmula de sucesso garantido, é a lembrança de que a força certa para o dia de hoje já está disponível." },
  { ref:"Salmos 46:1", titulo:"Refúgio presente", texto:"\"Deus é o nosso refúgio e fortaleza, socorro bem presente na angústia.\" Presente, não distante. No meio da dificuldade, não depois dela." },
  { ref:"Romanos 8:28", titulo:"Tudo coopera para o bem", texto:"\"Sabemos que todas as coisas cooperam para o bem daqueles que amam a Deus.\" Nem tudo que acontece é bom, mas há uma promessa de que nada é desperdiçado." },
  { ref:"Josué 1:9", titulo:"Esforça-te e tem bom ânimo", texto:"\"Não ta mandei eu? Esforça-te e tem bom ânimo; não temas, nem te espantes, porque o Senhor teu Deus é contigo.\" Coragem não é a ausência de medo, é agir apesar dele." },
  { ref:"Salmos 34:18", titulo:"Perto dos que sofrem", texto:"\"Perto está o Senhor dos que têm o coração quebrantado.\" Não existe tristeza longe demais do cuidado de Deus." },
  { ref:"Tiago 1:5", titulo:"Pedir sabedoria", texto:"\"Se algum de vós tem falta de sabedoria, peça-a a Deus, que a todos dá liberalmente.\" Diante de uma decisão difícil hoje, o primeiro passo pode ser simplesmente pedir clareza." },
  { ref:"Lamentações 3:22-23", titulo:"Misericórdias a cada manhã", texto:"\"As suas misericórdias se renovam cada manhã.\" Ontem não precisa definir hoje. Cada dia é uma nova chance." },
  { ref:"Salmos 139:14", titulo:"Formado com cuidado", texto:"\"Te louvarei, porque de um modo tão admirável e maravilhoso fui formado.\" Antes de qualquer conquista, seu valor já estava definido na forma como você foi criado." },
  { ref:"Gálatas 6:9", titulo:"Não desanimar", texto:"\"Não nos cansemos de fazer o bem, porque a seu tempo ceifaremos, se não houvermos desfalecido.\" O fruto de hoje às vezes só aparece depois. Continue." },
  { ref:"1 Pedro 5:7", titulo:"Lançar a ansiedade", texto:"\"Lançando sobre ele toda a vossa ansiedade, porque ele tem cuidado de vós.\" Carregar a preocupação sozinho nunca foi o plano." }
];

const doBanco = await lerColecao('devocionais');
const LISTA = doBanco.length ? doBanco : DEVOCIONAIS;
const hoje = new Date();
const diaDoAno = Math.floor((hoje - new Date(hoje.getFullYear(), 0, 1)) / 86400000);
const idxHoje = diaDoAno % LISTA.length;
document.getElementById('dataAtual').textContent = hoje.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
const devHoje = LISTA[idxHoje];
document.getElementById('cardHoje').innerHTML = `<p class="ref">${esc(devHoje.ref)}</p><h1>${esc(devHoje.titulo)}</h1><p>${esc(devHoje.texto)}</p>
  <div class="acoes"><button class="btn btn-amar" id="btnShare">Compartilhar</button>
  <a class="btn btn-outline" href="biblia.html" style="text-decoration:none;display:inline-block">Abrir na Bíblia</a></div>`;
document.getElementById('btnShare').addEventListener('click', () => {
  const msg = devHoje.titulo + '\n"' + devHoje.texto + '"\n' + devHoje.ref + '\nProjeto Aster';
  if (navigator.share) navigator.share({ text: msg }).catch(() => {});
  else navigator.clipboard.writeText(msg).then(() => alert('Copiado!'));
});
const lista = document.getElementById('listaAnteriores');
for (let i = 1; i <= 5; i++) {
  const dev = LISTA[(idxHoje - i + LISTA.length * 10) % LISTA.length];
  const d = new Date(hoje); d.setDate(d.getDate() - i);
  const div = document.createElement('div'); div.className = 'mini';
  div.innerHTML = `<div class="d">${d.toLocaleDateString('pt-BR')}</div><strong>${esc(dev.titulo)}</strong> — ${esc(dev.ref)}`;
  lista.appendChild(div);
}
</script>

<script type="module">import('./js/site-config.js').then(m=>m.aplicarConfigSite()).catch(()=>{});</script>
</body>
</html>
