<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Artigos – Painel Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../img/logo-192.png">
<meta name="theme-color" content="#0C3B5C">
<meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo"><img src="../img/logo.svg" alt="" width="26" height="26" style="vertical-align:middle;margin-right:8px">Projeto Aster</div>
      <p class="admin-cargo-label">Cargo: <strong id="cargoAtual">—</strong></p>
      <nav class="admin-nav" id="menuAdmin"></nav>
      <button id="btnSair" class="admin-btn-sair">Sair</button>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h1>Gerenciar Artigos</h1>
        <a href="../index.html" class="admin-link-site">Ver site →</a>
      </header>

      <div class="admin-filtros" id="filtros"></div>

      <section class="admin-bloco">
        <div id="listaGerenciar" class="admin-lista-noticias">
          <p class="admin-carregando">Carregando...</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { protegerPagina, sair, CARGOS } from "../js/auth.js";
    import { listarPorAutor, listarPorStatus, listarPublicadas, atualizarNoticia, excluirNoticia, STATUS, podeEditarArtigo } from "../js/noticias.js";
    import { db } from "../js/firebase-config.js";
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let usuarioAtual = null, cargoAtual = null, filtroAtual = 'todas', listaAtual = [];
    const ROTULO = { rascunho: 'Rascunho', em_revisao: 'Aguardando aprovação', aprovado: 'Aprovado', devolvido: 'Reprovado', indexado: 'Indexado', publicado: 'Publicado' };
    const VAZIO = {
      rascunho: 'Nenhum rascunho. Use "Salvar rascunho" no editor (basta o título) e ele aparece aqui.',
      em_revisao: 'Nada aguardando aprovação no momento.', aprovado: 'Nenhum artigo aprovado esperando publicação.',
      devolvido: 'Nenhum artigo reprovado.', indexado: 'Nenhum artigo indexado em edição.', publicado: 'Nenhum artigo publicado.',
      aprovados_todos: 'Nenhum artigo aprovado ainda.'
    };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    protegerPagina([CARGOS.ADMIN, CARGOS.EDITOR, CARGOS.COLUNISTA, CARGOS.REVISOR], async (user, cargo) => {
      usuarioAtual = user; cargoAtual = cargo;
      document.getElementById('cargoAtual').textContent = { administrador: 'Administrador', editor: 'Editor', colunista: 'Colunista', revisor: 'Revisor' }[cargo] || cargo;
      montarMenu(cargo); montarFiltros(cargo);
      await carregarLista();
      await montarBadgePendentes(cargo);
    });

    async function montarBadgePendentes(cargo) {
      if (cargo !== CARGOS.ADMIN && cargo !== CARGOS.EDITOR && cargo !== CARGOS.REVISOR) return;
      try {
        const pendentes = await listarPorStatus(STATUS.EM_REVISAO);
        if (!pendentes.length) return;
        const link = document.querySelector('#menuAdmin a[href="gerenciar-noticias.html"]');
        if (link) link.insertAdjacentHTML('beforeend', ' <span class="admin-badge">' + pendentes.length + '</span>');
      } catch (e) {}
    }

    function montarMenu(cargo) {
      const itens = [
        { href: 'dashboard.html', label: '📊 Dashboard', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'publicar.html', label: '✍️ Novo Artigo', cargos: ['administrador','editor','colunista'] },
        { href: 'gerenciar-noticias.html', label: '📰 Gerenciar Artigos', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'categorias-admin.html', label: '🏷️ Categorias', cargos: ['administrador','editor'] },
        { href: 'tags-admin.html', label: '🔖 Tags e Destaques', cargos: ['administrador','editor'] },
        { href: 'edicoes-admin.html', label: '📚 Edições', cargos: ['administrador','editor'] },
        { href: 'conteudo-admin.html', label: '🧩 Conteúdo do site', cargos: ['administrador','editor'] },
        { href: 'conteudo-admin.html?aba=biblioteca', label: '📚 Biblioteca', cargos: ['administrador','editor'] },
        { href: 'estatisticas-admin.html', label: '📈 Estatísticas', cargos: ['administrador','editor'] },
        { href: 'equipe-admin.html', label: '👥 Equipe', cargos: ['administrador'] },
        { href: 'usuarios.html', label: '👤 Usuários', cargos: ['administrador'] },
        { href: 'planos-admin.html', label: '💳 Apoio', cargos: ['administrador'] },
        { href: 'configuracoes.html', label: '⚙️ Configurações', cargos: ['administrador'] }
      ];
      document.getElementById('menuAdmin').innerHTML = itens.filter(i => i.cargos.includes(cargo)).map(i => '<a href="' + i.href + '">' + i.label + '</a>').join('');
    }

    function montarFiltros(cargo) {
      let opcoes;
      if (cargo === CARGOS.REVISOR) opcoes = [['em_revisao','Aguardando aprovação'],['aprovado','Aprovadas'],['devolvido','Devolvidas'],['indexado','Indexadas']];
      else if (cargo === CARGOS.COLUNISTA) opcoes = [['rascunho','Rascunhos'],['em_revisao','Aguardando aprovação'],['devolvido','Reprovados'],['aprovados_todos','Aprovados']];
      else opcoes = [['todas','Publicadas'],['rascunho','Rascunhos'],['em_revisao','Aguardando aprovação'],['aprovado','Aprovadas'],['devolvido','Devolvidas'],['indexado','Indexadas']];
      const aba = new URLSearchParams(location.search).get('aba');
      filtroAtual = opcoes.some(o => o[0] === aba) ? aba : opcoes[0][0];
      const div = document.getElementById('filtros');
      div.innerHTML = opcoes.map(o => '<button class="filtro-btn ' + (o[0] === filtroAtual ? 'ativo' : '') + '" data-filtro="' + o[0] + '">' + o[1] + '</button>').join('');
      div.querySelectorAll('.filtro-btn').forEach(btn => btn.addEventListener('click', () => {
        div.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo'); filtroAtual = btn.dataset.filtro; carregarLista();
      }));
    }

    async function carregarLista() {
      const lista = document.getElementById('listaGerenciar');
      lista.innerHTML = '<p class="admin-carregando">Carregando...</p>';
      try {
        if (cargoAtual === CARGOS.COLUNISTA) {
          const todas = await listarPorAutor(usuarioAtual.uid);
          if (filtroAtual === 'aprovados_todos') listaAtual = todas.filter(n => ['aprovado', 'indexado', 'publicado'].includes(n.status));
          else listaAtual = todas.filter(n => n.status === filtroAtual);
        } else if (cargoAtual === CARGOS.REVISOR) listaAtual = await listarPorStatus(filtroAtual);
        else listaAtual = filtroAtual === 'todas' ? await listarPublicadas(50) : await listarPorStatus(filtroAtual);
      } catch (e) { console.error(e); lista.innerHTML = '<p class="admin-vazio">Não foi possível carregar. Se o erro mencionar "index", abra o link que aparece no console (F12) para criar o índice no Firebase.</p>'; return; }
      if (!listaAtual.length) { lista.innerHTML = '<p class="admin-vazio">' + (VAZIO[filtroAtual] || 'Nenhum artigo encontrado neste filtro.') + '</p>'; return; }
      lista.innerHTML = listaAtual.map(montarLinha).join('');
      ligarBotoes();
    }

    function montarLinha(n) {
      const chefe = cargoAtual === CARGOS.ADMIN || cargoAtual === CARGOS.EDITOR, revisor = cargoAtual === CARGOS.REVISOR;
      let botoes = '';
      if ((chefe || revisor) && n.status === STATUS.EM_REVISAO)
        botoes = '<button class="btn-mini btn-aprovar" data-id="' + n.id + '" data-acao="aprovar">Aprovar</button><button class="btn-mini btn-devolver" data-id="' + n.id + '" data-acao="devolver">Devolver</button>';
      else if (chefe && n.status === STATUS.APROVADO)
        botoes = '<button class="btn-mini btn-publicar" data-id="' + n.id + '" data-acao="publicar">' + (n.edicao ? 'Indexar na edição' : 'Publicar') + '</button>' +
                 '<button class="btn-mini btn-devolver" data-id="' + n.id + '" data-acao="devolver">Reprovar</button>';
      else if (chefe && n.status === 'indexado')
        botoes = '<button class="btn-mini btn-devolver" data-id="' + n.id + '" data-acao="devolver">Reprovar</button>';
      const podeEditar = podeEditarArtigo(n, cargoAtual);
      const emAndamento = n.status !== STATUS.PUBLICADO && n.status !== 'indexado';
      const podeExcluir = cargoAtual === CARGOS.ADMIN || (cargoAtual === CARGOS.COLUNISTA && emAndamento && n.autorUid === usuarioAtual.uid);
      const autores = [n.autorNome || 'desconhecido'].concat(n.coautores || []).join(', ');
      const motivo = (n.status === STATUS.DEVOLVIDO && n.motivoDevolucao) ? '<div class="admin-motivo-devolucao">Motivo: ' + esc(n.motivoDevolucao) + '</div>' : '';
      return '<div class="admin-item-noticia"><div><strong>' + esc(n.titulo) + '</strong> ' +
        '<span class="admin-status status-' + esc(n.status) + '">' + esc(ROTULO[n.status] || n.status) + '</span> ' +
        '<span class="admin-autor-pequeno">por ' + esc(autores) + (n.edicao ? ' · ' + esc(n.edicao) : '') + '</span>' + motivo + '</div>' +
        '<div class="admin-acoes-linha">' + botoes +
        (podeEditar ? '<a href="publicar.html?id=' + n.id + '" class="btn-mini">' + (revisor ? 'Corrigir' : 'Editar') + '</a>' : '') +
        (podeExcluir ? '<button class="btn-mini btn-excluir" data-id="' + n.id + '" data-acao="excluir">Excluir</button>' : '') +
        '</div></div>';
    }

    async function edicaoAberta(nome) {
      const s = await getDocs(query(collection(db, 'edicoes'), where('nome', '==', nome)));
      return s.docs.some(d => d.data().status !== 'publicada');
    }

    function ligarBotoes() {
      document.querySelectorAll('[data-acao]').forEach(btn => btn.addEventListener('click', async () => {
        const id = btn.dataset.id, acao = btn.dataset.acao;
        try {
          if (acao === 'aprovar') await atualizarNoticia(id, { status: STATUS.APROVADO });
          else if (acao === 'devolver') {
            const motivo = (prompt('Motivo da devolução (o autor vai ver este texto — obrigatório):') || '').trim();
            if (!motivo) { alert('É obrigatório informar um motivo para devolver o artigo.'); return; }
            await atualizarNoticia(id, { status: STATUS.DEVOLVIDO, motivoDevolucao: motivo });
          }
          else if (acao === 'publicar') {
            const alvo = listaAtual.find(x => x.id === id);
            if (alvo && alvo.edicao) {
              if (!(await edicaoAberta(alvo.edicao))) { alert('A edição "' + alvo.edicao + '" não está aberta (já foi publicada ou ainda não foi aberta). Clique em Editar e escolha uma edição aberta.'); return; }
              await atualizarNoticia(id, { status: 'indexado' });
            } else await atualizarNoticia(id, { status: STATUS.PUBLICADO });
          } else if (acao === 'excluir') {
            if (!confirm('Tem certeza que deseja excluir este artigo? Essa ação não pode ser desfeita.')) return;
            await excluirNoticia(id);
          }
          await carregarLista();
        } catch (err) { alert('Não foi possível concluir essa ação. Verifique sua permissão.'); console.error(err); }
      }));
    }

    document.getElementById('btnSair').addEventListener('click', async () => { await sair(); window.location.href = '../login.html'; });
  </script>
</body>
</html>
