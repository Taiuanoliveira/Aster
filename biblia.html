<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bíblia – Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3056FF">
<meta name="description" content="Leia a Bíblia online em português (Almeida) e em inglês (KJV, WEB) no Projeto Aster.">
<meta property="og:site_name" content="Projeto Aster">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Bíblia – Projeto Aster">
<meta property="og:description" content="Leia a Bíblia online em português (Almeida) e em inglês (KJV, WEB) no Projeto Aster.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;600;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#B8E8FF;--esc:#3056FF;--med:#1F5A82;--amar:#FFFD73;--bg:#FBFAF6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Serif 4',Georgia,serif;background:var(--bg);color:var(--esc);padding-bottom:90px}
header{background:var(--esc);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-family:'Playfair Display',serif;font-weight:700;font-size:20px}
header a.volta{font-family:Inter,sans-serif;font-size:14px;color:#cfe6f3;font-weight:500}
.ctl{background:var(--azul);padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
select{padding:9px 10px;border-radius:8px;border:1px solid #9fd5ee;background:#fff;font:inherit;font-size:14px;color:var(--esc)}
main{max-width:720px;margin:0 auto;padding:26px 20px}
h1{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:4px}
.tr{font-size:12px;color:var(--med);margin-bottom:20px}
.ver{font-family:'Playfair Display',serif;font-size:19px;line-height:1.7;padding:4px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px}
.ver sup{font-family:Inter,sans-serif;font-size:11px;color:#C77A10;font-weight:600;margin-right:6px}
.ver.sel{outline:2px solid var(--med)}
.nota{font-size:13px;color:var(--med);border-left:3px solid var(--amar);padding:2px 10px;margin:2px 0 10px 8px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e6e2d8;padding:10px 14px;display:none;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.bar.on{display:flex}
.cor{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb;cursor:pointer}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--esc);background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--esc)}
.nav{display:flex;justify-content:space-between;margin-top:22px}
</style><link rel="stylesheet" href="css/tema.css">
<script src="js/tema.js"></script>
</head>
<body class="biblia-pag">
<header><a href="index.html">Projeto Aster</a><a class="volta" href="index.html">Voltar</a></header>
<div class="ctl">
<select id="ver"><option value="almeida">Almeida (português)</option><option value="kjv">KJV (inglês)</option><option value="web">WEB (inglês)</option></select>
<select id="liv"></select><select id="cap"></select>
</div>
<main>
<h1 id="tit"></h1><p class="tr" id="tr">Toque em um versículo para marcar, anotar ou compartilhar.</p>
<div id="txt"></div>
<div class="nav"><button onclick="mover(-1)">← Anterior</button><button onclick="mover(1)">Próximo →</button></div>
</main>
<div class="bar" id="bar">
<span class="cor" style="background:#FFE9A8" onclick="colorir('#FFE9A8')"></span>
<span class="cor" style="background:#BFE6FF" onclick="colorir('#BFE6FF')"></span>
<span class="cor" style="background:#CDEFC4" onclick="colorir('#CDEFC4')"></span>
<span class="cor" style="background:#FFD3E0" onclick="colorir('#FFD3E0')"></span>
<button onclick="colorir('')">Limpar cor</button>
<button onclick="anotar()">Anotar</button>
<button onclick="compartilhar()">Compartilhar</button>
</div>
<script>
const L=[["Gênesis","Genesis",50],["Êxodo","Exodus",40],["Levítico","Leviticus",27],["Números","Numbers",36],["Deuteronômio","Deuteronomy",34],["Josué","Joshua",24],["Juízes","Judges",21],["Rute","Ruth",4],["1 Samuel","1 Samuel",31],["2 Samuel","2 Samuel",24],["1 Reis","1 Kings",22],["2 Reis","2 Kings",25],["1 Crônicas","1 Chronicles",29],["2 Crônicas","2 Chronicles",36],["Esdras","Ezra",10],["Neemias","Nehemiah",13],["Ester","Esther",10],["Jó","Job",42],["Salmos","Psalms",150],["Provérbios","Proverbs",31],["Eclesiastes","Ecclesiastes",12],["Cantares","Song of Solomon",8],["Isaías","Isaiah",66],["Jeremias","Jeremiah",52],["Lamentações","Lamentations",5],["Ezequiel","Ezekiel",48],["Daniel","Daniel",12],["Oseias","Hosea",14],["Joel","Joel",3],["Amós","Amos",9],["Obadias","Obadiah",1],["Jonas","Jonah",4],["Miqueias","Micah",7],["Naum","Nahum",3],["Habacuque","Habakkuk",3],["Sofonias","Zephaniah",3],["Ageu","Haggai",2],["Zacarias","Zechariah",14],["Malaquias","Malachi",4],["Mateus","Matthew",28],["Marcos","Mark",16],["Lucas","Luke",24],["João","John",21],["Atos","Acts",28],["Romanos","Romans",16],["1 Coríntios","1 Corinthians",16],["2 Coríntios","2 Corinthians",13],["Gálatas","Galatians",6],["Efésios","Ephesians",6],["Filipenses","Philippians",4],["Colossenses","Colossians",4],["1 Tessalonicenses","1 Thessalonians",5],["2 Tessalonicenses","2 Thessalonians",3],["1 Timóteo","1 Timothy",6],["2 Timóteo","2 Timothy",4],["Tito","Titus",3],["Filemom","Philemon",1],["Hebreus","Hebrews",13],["Tiago","James",5],["1 Pedro","1 Peter",5],["2 Pedro","2 Peter",3],["1 João","1 John",5],["2 João","2 John",1],["3 João","3 John",1],["Judas","Jude",1],["Apocalipse","Revelation",22]];
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem('aster_bib')||'{}'),sel=new Set(),cur={};
L.forEach((b,i)=>$('liv').add(new Option(b[0],i)));
$('liv').value=42;
function fillCaps(){const n=L[$('liv').value][2];$('cap').innerHTML='';for(let i=1;i<=n;i++)$('cap').add(new Option('Cap. '+i,i))}
function bar(){$('bar').classList.toggle('on',sel.size>0)}
function salvar(){localStorage.setItem('aster_bib',JSON.stringify(S))}
function paint(p){const s=S[p.dataset.k]||{};p.style.background=s.c||'';const nx=p.nextElementSibling;if(nx&&nx.classList.contains('nota'))nx.remove();if(s.n){const n=document.createElement('div');n.className='nota';n.textContent=s.n;p.after(n)}}
function render(vs){
  $('txt').innerHTML='';
  vs.forEach(v=>{
    const p=document.createElement('p');p.className='ver';
    p.dataset.v=v.verse;p.dataset.k=cur.k+'.'+cur.c+'.'+v.verse;p.dataset.t=v.text.trim();
    const s=document.createElement('sup');s.textContent=v.verse;p.append(s,v.text.trim());
    p.onclick=()=>{sel.has(p)?sel.delete(p):sel.add(p);p.classList.toggle('sel');bar()};
    $('txt').append(p);paint(p);
  });
}
async function carregar(){
  sel.clear();bar();
  const b=L[$('liv').value],c=+$('cap').value,t=$('ver').value;
  const q=(b[2]==1?b[1]+' 1-60':b[1]+' '+c).replace(/ /g,'+');
  $('tit').textContent=b[0]+' '+c;$('txt').innerHTML='<p>Carregando…</p>';
  try{
    const r=await fetch('https://bible-api.com/'+q+'?translation='+t);
    if(!r.ok)throw 0;
    const d=await r.json();
    cur={b:b[0],c:c,k:b[1],t:$('ver').selectedOptions[0].text};
    $('tr').textContent=cur.t+' · toque em um versículo para marcar, anotar ou compartilhar.';
    render(d.verses);
  }catch(e){$('txt').innerHTML='<p>Não foi possível carregar agora. Tente de novo em instantes.</p>'}
}
function limpa(k){if(S[k]&&!S[k].c&&!S[k].n)delete S[k]}
function colorir(c){sel.forEach(p=>{const k=p.dataset.k;S[k]=S[k]||{};if(c)S[k].c=c;else delete S[k].c;limpa(k);paint(p)});salvar()}
function anotar(){
  const p=[...sel].sort((a,b)=>a.dataset.v-b.dataset.v)[0];if(!p)return;
  const k=p.dataset.k,n=prompt('Sua anotação:',(S[k]||{}).n||'');if(n===null)return;
  S[k]=S[k]||{};if(n.trim())S[k].n=n.trim();else delete S[k].n;limpa(k);paint(p);salvar();
}
function compartilhar(){
  const vs=[...sel].sort((a,b)=>a.dataset.v-b.dataset.v);if(!vs.length)return;
  const ref=cur.b+' '+cur.c+':'+vs[0].dataset.v+(vs.length>1?'-'+vs[vs.length-1].dataset.v:'');
  const msg='“'+vs.map(p=>p.dataset.t).join(' ')+'”\n'+ref+' ('+cur.t+')\nProjeto Aster';
  if(navigator.share)navigator.share({text:msg}).catch(()=>{});
  else navigator.clipboard.writeText(msg).then(()=>alert('Copiado!'));
}
function mover(d){
  let l=+$('liv').value,c=+$('cap').value;
  if(d>0){if(c<L[l][2])c++;else if(l<L.length-1){l++;c=1}else return}
  else{if(c>1)c--;else if(l>0){l--;c=L[l][2]}else return}
  $('liv').value=l;fillCaps();$('cap').value=c;carregar();window.scrollTo(0,0);
}
$('liv').onchange=()=>{fillCaps();carregar()};$('cap').onchange=carregar;$('ver').onchange=carregar;
fillCaps();$('cap').value=3;carregar();
</script>
<script type="module">import('./js/site-config.js').then(m=>m.aplicarConfigSite()).catch(()=>{});</script>
</body></html>
