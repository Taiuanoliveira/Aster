<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bíblia – Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<meta name="description" content="Leia a Bíblia online em português, inglês, espanhol, latim, hebraico e grego. Só edições livres, com o original ao lado da tradução.">

<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Bíblia – Projeto Aster">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#ececec;--esc:#000000;--med:#414141;--amar:#8a8a8a;--bg:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Newsreader',Georgia,serif;background:var(--bg);color:var(--esc);padding-bottom:90px}
header{background:var(--esc);padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px}
header a.volta{font-family:Manrope,sans-serif;font-size:14px;color:#e1e1e1;font-weight:500}
.ctl{background:var(--azul);padding:14px 20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
select{padding:9px 10px;border-radius:8px;border:1px solid #c8c8c8;background:#fff;font:inherit;font-size:14px;color:var(--esc)}
main{max-width:720px;margin:0 auto;padding:26px 20px}
h1{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:4px}
.tr{font-size:12px;color:var(--med);margin-bottom:20px}
.ver{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.7;padding:4px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px}
.ver sup{font-family:Manrope,sans-serif;font-size:11px;color:#858585;font-weight:600;margin-right:6px}
.ver.sel{outline:2px solid var(--med)}
.nota{font-size:13px;color:var(--med);border-left:3px solid var(--amar);padding:2px 10px;margin:2px 0 10px 8px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e2e2;padding:10px 14px;display:none;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.bar.on{display:flex}
.cor{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb;cursor:pointer}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--esc);background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--esc)}
.nav{display:flex;justify-content:space-between;margin-top:22px}
  footer{background:var(--esc);color:#d4d4d4;text-align:center;padding:22px 20px;font-size:13px}
  footer a{color:#d4d4d4;text-decoration:underline}

.ctl2{background:var(--azul);padding:0 20px 14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-family:Manrope,sans-serif;font-size:13px;color:var(--med)}
.ctl2 button{padding:6px 12px}
select{max-width:100%}
.aviso{font-family:Manrope,sans-serif;font-size:12.5px;line-height:1.5;color:var(--med);background:#f3f3f2;border:1px solid #e6e6e4;border-radius:10px;padding:9px 12px;margin:0 0 18px}
#txt .ver{font-size:var(--fs,19px)}
#txt .ver.par{padding:9px 10px;border-bottom:1px solid #ececec;border-radius:8px}
.ver .orig{line-height:1.7}
.ver .trad{font-size:.84em;line-height:1.55;color:var(--med);margin-top:3px}
.ver .trad sup{font-size:10px}
.he{font-family:'Ezra SIL','SBL Hebrew','Noto Serif Hebrew','Times New Roman',serif;font-size:1.3em;line-height:2;text-align:right}
.he sup{margin:0 0 0 8px}
.gr{font-family:'Palatino Linotype','Noto Serif','Times New Roman',serif}
.erro button{margin-left:8px}
html[data-tema="escuro"] .aviso{background:#262626;border-color:#3f3f3f;color:#b4b4b4}
html[data-tema="escuro"] #txt .ver.par{border-bottom-color:#3a3a3a}
html[data-tema="escuro"] .ver .trad,html[data-tema="escuro"] .ctl2{color:#b4b4b4}
</style><link rel="stylesheet" href="css/tema.css">
<script src="js/tema.js"></script>
<link rel="stylesheet" href="css/aster-visual.css">
<link rel="stylesheet" href="css/aster-tons.css">
<link rel="stylesheet" href="css/biblia-busca.css">
</head>
<body class="biblia-pag">
<header><a href="index.html" class="logo-aster"><svg class="logo-marca" viewBox="190 190 340 340" width="30" height="30" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="53" stroke-linecap="round"><path d="M358.4 367.0L359.0 221.8"/><path d="M358.4 367.0L471.0 277.2"/><path d="M358.4 367.0L499.2 400.5"/><path d="M358.4 367.0L421.5 498.6"/><path d="M358.4 367.0L297.6 499.2"/><path d="M358.4 367.0L220.1 400.5"/><path d="M358.4 367.0L247.6 276.4"/></g></svg><span class="logo-nome">aster</span></a><a class="volta" href="index.html">Voltar</a></header>
<div class="ctl">
<select id="ver" aria-label="Edição"></select>
<select id="liv" aria-label="Livro"></select><select id="cap" aria-label="Capítulo"></select>
</div>
<div class="busca" id="busca"><input id="q" type="search" placeholder="Buscar palavra ou ir para (ex.: Salmos 23, Jo 3:16)" aria-label="Buscar na Bíblia" enterkeyhint="search"><select id="qesc" aria-label="Onde buscar"><option value="">Toda a Bíblia</option><option value="at">Antigo Testamento</option><option value="nt">Novo Testamento</option></select><button type="button" id="qbt">Buscar</button></div>
<div id="res" class="res" hidden></div>
<div class="ctl2"><label for="cmp">Comparar com</label><select id="cmp" aria-label="Comparar com"></select><span class="fs"><button onclick="tam(-1)" aria-label="Diminuir a letra">A−</button> <button onclick="tam(1)" aria-label="Aumentar a letra">A+</button></span></div>
<main>
<h1 id="tit"></h1><p class="tr" id="tr">Carregando…</p>
<p class="aviso" id="aviso" style="display:none"></p>
<div id="txt"></div>
<div class="nav"><button onclick="mover(-1)">← Anterior</button><button onclick="mover(1)">Próximo →</button></div>
</main>
<div class="bar" id="bar">
<span class="cor" style="background:#e8e8e8" onclick="colorir('#e8e8e8')"></span>
<span class="cor" style="background:#dddddd" onclick="colorir('#dddddd')"></span>
<span class="cor" style="background:#CDEFC4" onclick="colorir('#CDEFC4')"></span>
<span class="cor" style="background:#e2e2e2" onclick="colorir('#e2e2e2')"></span>
<button onclick="colorir('')">Limpar cor</button>
<button onclick="anotar()">Anotar</button>
<button onclick="imagem()">Imagem</button>
<button onclick="compartilhar()">Compartilhar</button>
</div>
<script src="js/aster-imagem.js"></script>
<script src="js/biblia-local.js"></script>
<script>
const $=id=>document.getElementById(id),L=AsterBiblia.livros;
let S={},P={v:'pt-arc',l:42,c:3,cmp:'',fs:19},X=null,sel=new Set(),cur={},tk=0;
try{S=JSON.parse(localStorage.getItem('aster_bib')||'{}')}catch(e){}
try{Object.assign(P,JSON.parse(localStorage.getItem('aster_bib_pref')||'{}'))}catch(e){}
const ver=id=>X.versoes.find(v=>v.id===id),tem=(v,i)=>v.livros[i]!=null;
const cls=v=>v.idioma==='Hebraico'?'he':v.idioma==='Grego'?'gr':'';
const lg=v=>({Hebraico:'he',Grego:'grc',Latim:'la','Português':'pt','Español':'es',English:'en'})[v.idioma];
function salvar(){try{localStorage.setItem('aster_bib',JSON.stringify(S))}catch(e){}}
function salvarP(){try{localStorage.setItem('aster_bib_pref',JSON.stringify(P))}catch(e){}}
function bar(){$('bar').classList.toggle('on',sel.size>0)}
function grupos(el,vazio){
  el.innerHTML='';if(vazio)el.add(new Option(vazio,''));let g=null,ult='';
  X.versoes.forEach(v=>{if(v.idioma!==ult){g=document.createElement('optgroup');g.label=v.idioma;el.append(g);ult=v.idioma}g.append(new Option(v.longo,v.id))});
}
function fillLivros(){
  const v=ver(P.v);$('liv').innerHTML='';
  L.forEach((b,i)=>{const o=new Option(b[0]+(tem(v,i)?'':' (indisponível)'),i);o.disabled=!tem(v,i);$('liv').add(o)});
}
function fillCaps(){const n=ver(P.v).livros[P.l];$('cap').innerHTML='';for(let i=1;i<=n;i++)$('cap').add(new Option('Cap. '+i,i))}
function ajustar(){
  const v=ver(P.v);
  if(!tem(v,P.l)){let l=P.l;while(l<66&&!tem(v,l))l++;if(l>=66){l=0;while(l<66&&!tem(v,l))l++}P.l=l;P.c=1}
  P.c=Math.min(Math.max(1,P.c),v.livros[P.l]);
}
function sync(){$('ver').value=P.v;$('cmp').value=P.cmp;$('liv').value=P.l;fillCaps();$('cap').value=P.c;$('txt').style.setProperty('--fs',P.fs+'px');salvarP()}
function paint(p){const s=S[p.dataset.k]||{};p.style.background=s.c||'';const nx=p.nextElementSibling;if(nx&&nx.classList.contains('nota'))nx.remove();if(s.n){const n=document.createElement('div');n.className='nota';n.textContent=s.n;p.after(n)}}
function sup(n){const s=document.createElement('sup');s.textContent=n;return s}
function render(a,b,v,c){
  const box=$('txt');box.innerHTML='';
  a.forEach((t,i)=>{
    if(!t)return;const n=i+1,p=document.createElement('div'),o=document.createElement('div');
    p.className='ver'+(c?' par':'');p.dataset.v=n;p.dataset.k=cur.k+'.'+cur.c+'.'+n;p.dataset.t=t;
    o.className='orig '+cls(v);o.lang=lg(v);if(v.dir==='rtl')o.dir='rtl';o.append(sup(n),t);p.append(o);
    if(c){const d=document.createElement('div');d.className='trad '+cls(c);d.lang=lg(c);if(c.dir==='rtl')d.dir='rtl';d.append(sup(n),(b&&b[i])||'—');p.append(d)}
    p.onclick=()=>{sel.has(p)?sel.delete(p):sel.add(p);p.classList.toggle('sel');bar()};
    box.append(p);paint(p);
  });
  if(!box.firstChild)box.innerHTML='<p>Este capítulo não existe nesta edição.</p>';
}
async function carregar(){
  sel.clear();bar();const meu=++tk,v=ver(P.v),c=P.cmp?ver(P.cmp):null,b=L[P.l];
  cur={b:b[0],c:P.c,k:b[1],t:v.longo};$('tit').textContent=b[0]+' '+P.c;
  $('tr').textContent=v.longo+' · '+v.licenca+(c?' · comparando com '+c.longo:'')+'. Toque em um versículo para marcar, anotar ou compartilhar.';
  const falta=c&&!tem(c,P.l)?'A edição de comparação não tem este livro.':'';
  const nt=[v.nota,c&&c.nota,falta].filter(Boolean).join(' ');$('aviso').textContent=nt;$('aviso').style.display=nt?'':'none';
  $('txt').innerHTML='<p>Carregando…</p>';
  try{
    const [a,x]=await Promise.all([AsterBiblia.capitulo(P.v,P.l,P.c),c&&tem(c,P.l)?AsterBiblia.capitulo(P.cmp,P.l,P.c):null]);
    if(meu===tk)render(a,x,v,c);
  }catch(e){if(meu===tk)$('txt').innerHTML='<p class="erro">Não foi possível carregar este capítulo agora. <button onclick="carregar()">Tentar de novo</button></p>'}
}
function anotar(){
  const p=[...sel].sort((a,b)=>a.dataset.v-b.dataset.v)[0];if(!p)return;
  const k=p.dataset.k,n=prompt('Sua anotação:',(S[k]||{}).n||'');if(n===null)return;
  S[k]=S[k]||{};if(n.trim())S[k].n=n.trim();else delete S[k].n;limpa(k);paint(p);salvar();
}
function limpa(k){if(S[k]&&!S[k].c&&!S[k].n)delete S[k]}
function colorir(c){sel.forEach(p=>{const k=p.dataset.k;S[k]=S[k]||{};if(c)S[k].c=c;else delete S[k].c;limpa(k);paint(p)});salvar()}
function compartilhar(){
  const vs=[...sel].sort((a,b)=>a.dataset.v-b.dataset.v);if(!vs.length)return;
  const ref=cur.b+' '+cur.c+':'+vs[0].dataset.v+(vs.length>1?'-'+vs[vs.length-1].dataset.v:'');
  const msg='“'+vs.map(p=>p.dataset.t).join(' ')+'”\n'+ref+' ('+cur.t+')\nProjeto Aster';
  if(navigator.share)navigator.share({text:msg}).catch(()=>{});
  else navigator.clipboard.writeText(msg).then(()=>alert('Copiado!'));
}
function imagem(){
  const vs=[...sel].sort((a,b)=>a.dataset.v-b.dataset.v);if(!vs.length)return;
  const ref=cur.b+' '+cur.c+':'+vs[0].dataset.v+(vs.length>1?'-'+vs[vs.length-1].dataset.v:'');
  AsterImagem.abrir({texto:vs.map(p=>p.dataset.t).join(' '),ref:ref,edicao:cur.t});
}
function mover(d){
  const v=ver(P.v);let l=P.l,c=P.c;
  if(d>0){if(c<v.livros[l])c++;else{l++;while(l<66&&!tem(v,l))l++;if(l>=66)return;c=1}}
  else{if(c>1)c--;else{l--;while(l>=0&&!tem(v,l))l--;if(l<0)return;c=v.livros[l]}}
  P.l=l;P.c=c;sync();carregar();window.scrollTo(0,0);
}
function tam(d){P.fs=Math.min(30,Math.max(14,P.fs+d*2));sync()}
function trocaVersao(){
  P.v=$('ver').value;if(P.cmp===P.v)P.cmp='';
  if(['Latim','Hebraico','Grego'].includes(ver(P.v).idioma)&&!P.cmp)P.cmp='pt-arc';
  ajustar();fillLivros();sync();carregar();
}
AsterBiblia.indice().then(d=>{
  X=d;if(!ver(P.v))P.v='pt-livre';if(P.cmp&&!ver(P.cmp))P.cmp='';
  grupos($('ver'));grupos($('cmp'),'Sem comparação');ajustar();fillLivros();sync();carregar();
  $('ver').onchange=trocaVersao;
  $('cmp').onchange=()=>{P.cmp=$('cmp').value;if(P.cmp===P.v)P.cmp='';sync();carregar()};
  $('liv').onchange=()=>{P.l=+$('liv').value;P.c=1;sync();carregar()};
  $('cap').onchange=()=>{P.c=+$('cap').value;sync();carregar()};
}).catch(()=>{$('tr').textContent='Não foi possível carregar a lista de edições. Atualize a página.'});
</script>
<script src="js/biblia-busca.js"></script>
<footer>
  <img class="logo-rodape" src="img/logo.svg" alt="" width="18" height="18" style="vertical-align:middle;margin-right:6px"> Projeto Aster · <a href="equipe.html">Nossa Equipe</a> · <a href="termos.html">Termos de uso</a> · <a href="privacidade.html">Privacidade</a>
</footer>

</body></html>
