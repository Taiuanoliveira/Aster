<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artigos – Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3056FF">
<meta property="og:site_name" content="Projeto Aster">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Artigos – Projeto Aster">
<meta property="og:description" content="Artigos, estudos e reflexões do Projeto Aster.">
<meta name="description" content="Artigos, estudos e reflexões do Projeto Aster.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/leitura.css"><link rel="stylesheet" href="css/tema.css"><script src="js/tema.js"></script>
</head><body>
<section class="faixa"><p class="rot">Leitura</p><h1 id="titulo">Artigos</h1><p class="sub" id="sub">Estudos, reflexões e textos do Projeto Aster.</p></section>
<main class="pag" style="max-width:1040px">
  <div class="aa-chips" id="chips"></div>
  <input class="aa-busca" id="busca" type="search" placeholder="Buscar por título ou assunto…">
  <div class="aa-grade" id="grade"><p class="vazio">Carregando…</p></div>
</main>
<script type="module">
import { montarTopoRodape } from './js/leitura.js';
import { carregarArtigos, cartaoHTML, injetarEstilos, esc } from './js/artigos-lista.js';
montarTopoRodape(); injetarEstilos();
const P = new URLSearchParams(location.search), $ = id => document.getElementById(id);
let cat = P.get('cat') || '', tag = P.get('tag') || '', dados = null;
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function desenhar() {
  const { artigos, ...tx } = dados, q = norm($('busca').value);
  const lista = artigos.filter(a => (!cat || (a.categorias || [a.categoria]).includes(cat)) && (!tag || (a.tags || []).includes(tag)) && (!q || norm(a.titulo + ' ' + (a.resumo || '')).includes(q)));
  $('grade').innerHTML = lista.length ? lista.map(a => cartaoHTML(a, tx)).join('') : '<p class="vazio">Nenhum artigo encontrado.</p>';
  $('chips').innerHTML = '<a class="aa-chip' + (!cat ? ' on' : '') + '" data-c="">Todos</a>' +
    Object.entries(tx.cats).map(([s, c]) => '<a class="aa-chip' + (cat === s ? ' on' : '') + '" data-c="' + esc(s) + '">' + esc((c.emoji ? c.emoji + ' ' : '') + c.nome) + '</a>').join('');
  $('chips').querySelectorAll('.aa-chip').forEach(el => el.onclick = () => { cat = el.dataset.c; tag = ''; history.replaceState(null, '', cat ? '?cat=' + encodeURIComponent(cat) : 'artigos.html'); desenhar(); });
  if (tag) { const t = tx.tags[tag]; $('titulo').textContent = '#' + (t ? t.nome : tag); }
}
try { dados = await carregarArtigos(); desenhar(); }
catch (e) { $('grade').innerHTML = '<p class="vazio">Não foi possível carregar os artigos agora.</p>'; console.error(e); }
$('busca').addEventListener('input', () => dados && desenhar());
</script></body></html>
