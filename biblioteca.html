<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca em PDF – Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0C3B5C">
<meta name="description" content="Biblioteca do Projeto Aster: livros e materiais para estudo.">
<meta property="og:site_name" content="Projeto Aster">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Biblioteca em PDF – Projeto Aster">
<meta property="og:description" content="Biblioteca do Projeto Aster: livros e materiais para estudo.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--esc:#0C3B5C;--med:#1F5A82;--azul:#B8E8FF;--amar:#E8A33D;--bg:#FBFAF6;--texto:#1a1a1a;--cinza:#666;--card:#fff;--borda:#e3ddd0}
  
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,sans-serif;background:var(--bg);color:var(--texto);padding-bottom:60px}
  a{color:inherit}
  header.topo{background:var(--esc);display:flex;align-items:center;justify-content:space-between;padding:18px 40px;flex-wrap:wrap;gap:12px}
  .logo-aster{display:flex;align-items:center;gap:8px;font-family:'Playfair Display',serif;font-weight:700;font-size:20px;color:#fff;text-decoration:none}
  .logo-aster .estrela{color:var(--amar)}
  nav.nav-topo a{color:#dfeaf2;text-decoration:none;font-size:14px;font-weight:500;margin-left:20px}
  nav.nav-topo a:hover{color:var(--amar)}

  main{max-width:960px;margin:0 auto;padding:40px 20px}
  h1{font-family:'Playfair Display',serif;font-size:28px;margin-bottom:6px}
  .sub{color:var(--cinza);font-size:14px;margin-bottom:10px}
  .aviso{background:#FFF4DE;border:1px solid #E8A33D;color:#6b4c00;font-size:13px;padding:12px 16px;border-radius:10px;margin-bottom:26px}
  

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}
  .livro{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:18px;display:flex;flex-direction:column}
  .capa{width:100%;height:150px;border-radius:6px;background:var(--esc);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;color:var(--amar);font-size:15px;text-align:center;padding:10px;margin-bottom:14px;box-shadow:0 8px 20px rgba(12,59,92,.25)}
  .capa.img{height:auto;aspect-ratio:3/4;padding:0;overflow:hidden}.capa.img img{width:100%;height:100%;object-fit:cover;display:block}
  .livro h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--esc);margin-bottom:6px}
  
  .livro p{font-size:13px;color:var(--cinza);line-height:1.5;flex:1;margin-bottom:14px}
  .btn{padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer;border:none;background:var(--amar);color:var(--esc)}
</style>
<link rel="stylesheet" href="css/tema.css">
<script src="js/tema.js"></script>
</head>
<body>

<header class="topo">
  <a href="index.html" class="logo-aster"><span class="estrela">✦</span> Projeto Aster</a>
  <nav class="nav-topo">
    <a href="biblia.html">Bíblia</a>
    <a href="edicoes.html">Editorial</a><a href="artigos.html">Artigos</a>
    <a href="estudos.html">Estudos</a>
    <a href="biblioteca.html">Biblioteca</a>
    <a href="apoiar.html">Apoie</a>
    <a href="login.html">Entrar</a>
  </nav>
</header>

<main>
  <h1>Biblioteca em PDF</h1>
  <p class="sub">Livros e materiais para baixar.</p>
  <p class="aviso">Esta seção ainda está em montagem: os títulos abaixo são exemplos de como vai ficar. Os PDFs reais serão adicionados em breve.</p>

  <div class="grid" id="grid"></div>
</main>

<script type="module">
let lerColecao = async () => [];
try { ({ lerColecao } = await import('./js/conteudo.js')); } catch (e) {}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIVROS = [
  { titulo:"Guia de Oração para 30 Dias", resumo:"Um roteiro simples com um tema de oração por dia, para criar o hábito de orar com constância.", arquivo:"#" },
  { titulo:"Introdução ao Livro de Salmos", resumo:"Panorama histórico e literário dos Salmos, com sugestões de leitura por tipo (louvor, lamento, sabedoria).", arquivo:"#" },
  { titulo:"Família segundo a Bíblia", resumo:"Reflexões curtas sobre papéis, cuidado mútuo e perdão dentro de casa, com base em textos do Antigo e Novo Testamento.", arquivo:"#" },
  { titulo:"Caderno de Estudo: Romanos", resumo:"Estudo capítulo a capítulo da carta de Paulo aos Romanos, com perguntas para discussão em grupo.", arquivo:"#" },
  { titulo:"100 Promessas da Bíblia", resumo:"Uma coletânea organizada por tema — ansiedade, provisão, perdão, força — para consulta rápida.", arquivo:"#" },
  { titulo:"Guia de Leitura Devocional", resumo:"Como montar sua própria rotina devocional diária, com exemplos de estrutura e perguntas de reflexão.", arquivo:"#" }
];

const doBanco = await lerColecao('biblioteca');
const itens = doBanco.length ? doBanco : LIVROS;
if (doBanco.length) { const av = document.querySelector('.aviso'); if (av) av.remove(); }
const grid = document.getElementById('grid');
// Converte links do Google Drive / Dropbox em download direto
function baixarDireto(u) {
  u = String(u || '').trim();
  let m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
  if (m) return 'https://drive.google.com/uc?export=download&id=' + m[1];
  if (/^https:\/\/(www\.)?dropbox\.com\//i.test(u)) return u.replace(/([?&])dl=0/, '$1dl=1').replace(/^([^?]*)$/, '$1?dl=1');
  return u;
}
itens.forEach(l => {
  l = { ...l, arquivo: baixarDireto(l.arquivo) };
  const ok = l.arquivo && /^https:\/\//i.test(l.arquivo);
  const div = document.createElement('div'); div.className = 'livro';
  div.innerHTML = `${l.capaUrl && /^https:\/\//i.test(l.capaUrl) ? '<div class="capa img"><img src="' + esc(l.capaUrl) + '" alt="' + esc(l.titulo) + '"></div>' : '<div class="capa">' + esc(l.titulo) + '</div>'}<h3>${esc(l.titulo)}</h3><p>${esc(l.resumo)}</p><a class="btn" href="${ok ? esc(l.arquivo) : '#'}"${ok ? ' target="_blank" rel="noopener"' : ''}>Baixar PDF</a>`;
  if (!ok) div.querySelector('a').addEventListener('click', e => { e.preventDefault(); alert('Este PDF ainda não foi adicionado. Em breve!'); });
  grid.appendChild(div);
});
</script>

<script type="module">import('./js/site-config.js').then(m=>m.aplicarConfigSite()).catch(()=>{});</script>
</body>
</html>
