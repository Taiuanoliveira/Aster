<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Artigos – Painel Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../img/logo-192.png">
<meta name="theme-color" content="#0C3B5C">
<meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo"><img src="../img/logo.svg" alt="" width="26" height="26" style="vertical-align:middle;margin-right:8px">Projeto Aster</div>
      <p class="admin-cargo-label">Cargo: <strong id="cargoAtual">—</strong></p>
      <nav class="admin-nav" id="menuAdmin"></nav>
      <button id="btnSair" class="admin-btn-sair">Sair</button>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h1>Gerenciar Artigos</h1>
        <a href="../index.html" class="admin-link-site">Ver site →</a>
      </header>

      <div class="admin-filtros" id="filtros"></div>

      <section class="admin-bloco">
        <div id="listaGerenciar" class="admin-lista-noticias">
          <p class="admin-carregando">Carregando...</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { protegerPagina, sair, CARGOS } from "../js/auth.js";
    import { listarPorAutor, listarPorStatus, listarPublicadas, atualizarNoticia, excluirNoticia, STATUS } from "../js/noticias.js";

    let usuarioAtual = null, cargoAtual = null, filtroAtual = 'todas', listaAtual = [], rotulos = {};
    const ROTULO = { rascunho: 'Rascunho', em_revisao: 'Aguardando aprovação', devolvido: 'Reprovado', aprovado: 'Aprovado', indexado: 'Indexado', publicado: 'Publicado' };
    const VAZIO = {
      rascunho: 'Nenhum rascunho. Use "Salvar rascunho" no editor (basta o título) e ele aparece aqui.',
      em_revisao: 'Nada aguardando aprovação no momento.', aprovado: 'Nenhum artigo aprovado esperando publicação.',
      devolvido: 'Nenhum artigo reprovado.', indexado: 'Nenhum artigo indexado (formato antigo).', publicado: 'Nenhum artigo publicado.'
    };
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const quemSou = () => usuarioAtual.displayName || usuarioAtual.email;
    const ehChefe = () => cargoAtual === CARGOS.ADMIN || cargoAtual === CARGOS.EDITOR;

    protegerPagina([CARGOS.ADMIN, CARGOS.EDITOR, CARGOS.COLUNISTA, CARGOS.REVISOR], async (user, cargo) => {
      usuarioAtual = user; cargoAtual = cargo;
      document.getElementById('cargoAtual').textContent = { administrador: 'Administrador', editor: 'Editor', colunista: 'Colunista', revisor: 'Revisor' }[cargo] || cargo;
      montarMenu(cargo); montarFiltros(cargo);
      await carregarLista();
      atualizarContagens();
    });

    function montarMenu(cargo) {
      const itens = [
        { href: 'dashboard.html', label: '📊 Dashboard', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'publicar.html', label: '✍️ Novo Artigo', cargos: ['administrador','editor','colunista'] },
        { href: 'gerenciar-noticias.html', label: '📰 Gerenciar Artigos', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'categorias-admin.html', label: '🏷️ Categorias', cargos: ['administrador','editor'] },
        { href: 'tags-admin.html', label: '🔖 Tags e Destaques', cargos: ['administrador','editor'] },
        { href: 'edicoes-admin.html', label: '📚 Edições', cargos: ['administrador','editor'] },
        { href: 'conteudo-admin.html', label: '🧩 Conteúdo do site', cargos: ['administrador','editor'] },
        { href: 'estatisticas-admin.html', label: '📈 Estatísticas', cargos: ['administrador','editor'] },
        { href: 'equipe-admin.html', label: '👥 Equipe', cargos: ['administrador'] },
        { href: 'usuarios.html', label: '👤 Usuários', cargos: ['administrador'] },
        { href: 'planos-admin.html', label: '💳 Apoio', cargos: ['administrador'] },
        { href: 'configuracoes.html', label: '⚙️ Configurações', cargos: ['administrador'] }
      ];
      document.getElementById('menuAdmin').innerHTML = itens.filter(i => i.cargos.includes(cargo)).map(i => '<a href="' + i.href + '">' + i.label + '</a>').join('');
    }

    function montarFiltros(cargo) {
      let opcoes;
      if (cargo === CARGOS.REVISOR) opcoes = [['em_revisao','Aguardando aprovação'],['devolvido','Reprovados'],['aprovado','Aprovados']];
      else if (cargo === CARGOS.COLUNISTA) opcoes = [['todas','Meus artigos'],['rascunho','Rascunhos'],['em_revisao','Aguardando aprovação'],['devolvido','Reprovados'],['aprovado','Aprovados'],['publicado','Publicados']];
      else opcoes = [['todas','Publicados'],['rascunho','Rascunhos'],['em_revisao','Aguardando aprovação'],['devolvido','Reprovados'],['aprovado','Aprovados'],['indexado','Indexados']];
      opcoes.forEach(o => rotulos[o[0]] = o[1]);
      const aba = new URLSearchParams(location.search).get('aba');
      filtroAtual = opcoes.some(o => o[0] === aba) ? aba : opcoes[0][0];
      const div = document.getElementById('filtros');
      div.innerHTML = opcoes.map(o => '<button class="filtro-btn ' + (o[0] === filtroAtual ? 'ativo' : '') + '" data-filtro="' + o[0] + '">' + o[1] + '</button>').join('');
      div.querySelectorAll('.filtro-btn').forEach(btn => btn.addEventListener('click', () => {
        div.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo'));
        btn.classList.add('ativo'); filtroAtual = btn.dataset.filtro; carregarLista();
      }));
    }

    async function atualizarContagens() {
      try {
        let chave = 'em_revisao', n = 0;
        if (cargoAtual === CARGOS.COLUNISTA) { chave = 'devolvido'; n = (await listarPorAutor(usuarioAtual.uid)).filter(x => x.status === 'devolvido').length; }
        else n = (await listarPorStatus('em_revisao')).length;
        const b = document.querySelector('#filtros [data-filtro="' + chave + '"]');
        if (b) b.textContent = rotulos[chave] + (n ? ' (' + n + ')' : '');
      } catch (e) {}
    }

    async function carregarLista() {
      const lista = document.getElementById('listaGerenciar');
      lista.innerHTML = '<p class="admin-carregando">Carregando...</p>';
      try {
        if (cargoAtual === CARGOS.COLUNISTA) {
          const todas = await listarPorAutor(usuarioAtual.uid);
          listaAtual = filtroAtual === 'todas' ? todas : todas.filter(n => n.status === filtroAtual);
        } else if (cargoAtual === CARGOS.REVISOR) listaAtual = await listarPorStatus(filtroAtual);
        else listaAtual = filtroAtual === 'todas' ? await listarPublicadas(50) : await listarPorStatus(filtroAtual);
      } catch (e) { console.error(e); lista.innerHTML = '<p class="admin-vazio">Não foi possível carregar. Se o erro mencionar "index", abra o link que aparece no console (F12) para criar o índice no Firebase.</p>'; return; }
      if (!listaAtual.length) { lista.innerHTML = '<p class="admin-vazio">' + (VAZIO[filtroAtual] || 'Nenhum artigo encontrado neste filtro.') + '</p>'; return; }
      lista.innerHTML = listaAtual.map(montarLinha).join('');
      ligarBotoes();
    }

    function montarLinha(n) {
      const chefe = ehChefe(), revisor = cargoAtual === CARGOS.REVISOR, autor = cargoAtual === CARGOS.COLUNISTA;
      const st = n.status, dono = n.autorUid === usuarioAtual.uid;
      const b = (acao, rotulo, cls) => '<button class="btn-mini ' + cls + '" data-id="' + n.id + '" data-acao="' + acao + '">' + rotulo + '</button>';
      let botoes = '';
      if ((chefe || revisor) && st === 'em_revisao') botoes += b('aprovar', 'Aprovar', 'btn-aprovar') + b('reprovar', 'Reprovar', 'btn-devolver btn-reprovar');
      if ((chefe || revisor) && st === 'aprovado') botoes += b('reprovar', 'Reprovar', 'btn-devolver btn-reprovar');
      if (chefe && st === 'aprovado') botoes += n.edicao
        ? '<span class="admin-autor-pequeno">sai quando a edição "' + esc(n.edicao) + '" for publicada</span>'
        : b('publicar', 'Publicar', 'btn-publicar');
      const editavelAutor = autor && (st === 'rascunho' || st === 'devolvido');
      const podeEditar = chefe || (revisor && ['em_revisao', 'aprovado', 'devolvido'].includes(st)) || editavelAutor;
      const podeExcluir = cargoAtual === CARGOS.ADMIN || (autor && dono && editavelAutor);
      const autores = [n.autorNome || 'desconhecido'].concat(n.coautores || []).join(', ');
      const motivo = (st === 'devolvido' && n.motivoReprovacao) ? '<div style="margin-top:6px;font-size:13px;color:#8a1c14;background:#fdecea;padding:6px 10px;border-radius:6px;">Motivo da reprovação: ' + esc(n.motivoReprovacao) + '</div>' : '';
      return '<div class="admin-item-noticia"><div><strong>' + esc(n.titulo) + '</strong> ' +
        '<span class="admin-status status-' + esc(st) + '">' + esc(ROTULO[st] || st) + '</span> ' +
        '<span class="admin-autor-pequeno">por ' + esc(autores) + (n.edicao ? ' · ' + esc(n.edicao) : '') + (n.materiaCapa ? ' · ⭐ capa' : '') + '</span>' + motivo + '</div>' +
        '<div class="admin-acoes-linha">' + botoes +
        (podeEditar ? '<a href="publicar.html?id=' + n.id + '" class="btn-mini">' + (revisor ? 'Corrigir' : 'Editar') + '</a>' : '') +
        ((autor && !editavelAutor) ? '<span class="admin-autor-pequeno">🔒 bloqueado (' + esc((ROTULO[st] || st).toLowerCase()) + ')</span>' : '') +
        (podeExcluir ? '<button class="btn-mini btn-excluir" data-id="' + n.id + '" data-acao="excluir">Excluir</button>' : '') +
        '</div></div>';
    }

    function ligarBotoes() {
      document.querySelectorAll('[data-acao]').forEach(btn => btn.addEventListener('click', async () => {
        const id = btn.dataset.id, acao = btn.dataset.acao;
        btn.disabled = true;
        try {
          const quem = { revisadoPor: quemSou(), revisadoEm: new Date().toISOString() };
          if (acao === 'aprovar') await atualizarNoticia(id, Object.assign({ status: STATUS.APROVADO, motivoReprovacao: '' }, quem));
          else if (acao === 'reprovar') {
            const motivo = (prompt('Explique o que o autor precisa corrigir. Ele verá esta mensagem:') || '').trim();
            if (!motivo) { alert('Para reprovar é preciso escrever o motivo.'); btn.disabled = false; return; }
            await atualizarNoticia(id, Object.assign({ status: STATUS.DEVOLVIDO, motivoReprovacao: motivo }, quem));
          }
          else if (acao === 'publicar') await atualizarNoticia(id, { status: STATUS.PUBLICADO });
          else if (acao === 'excluir') {
            if (!confirm('Tem certeza que deseja excluir este artigo? Essa ação não pode ser desfeita.')) { btn.disabled = false; return; }
            await excluirNoticia(id);
          }
          await carregarLista(); atualizarContagens();
        } catch (err) { btn.disabled = false; alert('Não foi possível concluir essa ação. Verifique sua permissão.'); console.error(err); }
      }));
    }

    document.getElementById('btnSair').addEventListener('click', async () => { await sair(); window.location.href = '../login.html'; });
  </script>
</body>
</html>
