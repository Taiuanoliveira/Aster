<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editorial – Projeto Aster</title>
<meta name="description" content="Todas as edições do editorial mensal do Projeto Aster.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/leitura.css"><link rel="stylesheet" href="css/tema.css"><script src="js/tema.js"></script>
</head><body>
<section class="faixa"><p class="rot">Editorial do mês</p><h1>Edições</h1><p class="sub">Um tema bíblico por edição, estudado a fundo.</p></section>
<main class="pag"><div class="grade" id="lista"><p class="vazio">Carregando…</p></div></main>
<script type="module">
import { db } from './js/firebase-config.js';
import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { montarTopoRodape, esc } from './js/leitura.js';
montarTopoRodape();
const el=document.getElementById('lista');
try{
  const s=await getDocs(collection(db,'edicoes'));
  const l=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.status==='publicada').sort((a,b)=>String(b.criadoEm||'').localeCompare(String(a.criadoEm||'')));
  el.innerHTML=l.length?'':'<p class="vazio">A primeira edição sairá em breve.</p>';
  l.forEach(e=>{
    const a=document.createElement('a');a.className='ed-card';a.href='edicao.html?id='+encodeURIComponent(e.id);
    const capa=e.capaUrl?' style="background-image:url(\''+esc(e.capaUrl)+'\')"':'';
    a.innerHTML='<div class="ed-capa"'+capa+'>'+(e.capaUrl?'':esc(e.nome))+'</div><div class="ed-corpo"><small>'+esc(e.tema||'')+'</small><h3>'+esc(e.nome)+'</h3><p>'+esc(e.descricao||'')+'</p></div>';
    el.append(a);
  });
}catch(err){el.innerHTML='<p class="vazio">Não foi possível carregar as edições agora.</p>';console.error(err);}
</script></body></html>
