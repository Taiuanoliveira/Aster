<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Artigo – Painel Projeto Aster</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta name="theme-color" content="#0C3B5C">
<meta name="robots" content="noindex">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    .ql-editor { min-height: 260px; line-height: 1.7; }
    .ql-snow .ql-picker { color: #0C3B5C; }
  </style>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">Projeto Aster</div>
      <p class="admin-cargo-label">Cargo: <strong id="cargoAtual">—</strong></p>
      <nav class="admin-nav" id="menuAdmin"></nav>
      <button id="btnSair" class="admin-btn-sair">Sair</button>
    </aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <h1 id="tituloPagina">Novo Artigo</h1>
        <a href="../index.html" class="admin-link-site">Ver site →</a>
      </header>
      <section class="admin-bloco">
        <div id="mensagemErro" class="auth-msg erro" style="display:none;"></div>
        <div id="mensagemSucesso" class="auth-msg sucesso" style="display:none;"></div>
        <form id="formNoticia" class="form-noticia">
          <label for="titulo">Título</label>
          <input type="text" id="titulo" required placeholder="Título do artigo">

          <label>Categorias <span style="font-weight:400;color:#888;">(marque uma ou mais — a primeira marcada vira a categoria principal)</span></label>
          <div id="containerCategorias" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
            <p style="font-size:13px;color:#777;">Carregando categorias...</p>
          </div>
          <input type="hidden" id="categoria" required>

          <label for="destaque">Destaque</label>
          <select id="destaque">
            <option value="">Nenhum</option>
          </select>

          <label>Tags</label>
          <div id="containerTags" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
            <p style="font-size:13px;color:#777;">Carregando tags...</p>
          </div>

          <label for="resumo">Resumo (aparece nos cards)</label>
          <textarea id="resumo" rows="2" placeholder="Resumo curto do artigo"></textarea>

          <label>Conteúdo completo</label>
          <div id="editorQuill"></div>
          <input type="hidden" id="conteudo">

          <label>Coautores (opcional, até 3 autores contando você) — escolha pessoas da Equipe para o artigo aparecer na lista delas</label>
          <input type="text" id="coautor1" list="listaEquipe" maxlength="80" placeholder="Nome do 2º autor">
          <input type="text" id="coautor2" list="listaEquipe" maxlength="80" placeholder="Nome do 3º autor" style="margin-top:8px">
          <datalist id="listaEquipe"></datalist>

          <label for="edicao">Edição (só aparecem edições abertas)</label>
          <select id="edicao">
            <option value="">Nenhum (artigo avulso)</option>
          </select>

          <div id="edicaoOpcoes" style="display:none;margin-top:12px;">
            <label for="ordemEdicao">Ordem na edição</label>
            <input type="number" id="ordemEdicao" value="1" min="1" style="width:80px;padding:6px;border:1px solid #ddd;">
            <p style="font-size:11px;color:#888;margin-top:4px;">Posição do artigo dentro da edição (1 = primeiro)</p>
            <label style="display:flex;align-items:center;gap:8px;margin-top:14px;">
              <input type="checkbox" id="gratuito" style="width:auto;">
              Artigo gratuito (mesmo fazendo parte da edição paga)
            </label>

            <label for="paywallOverride" style="margin-top:14px;">Regra de acesso pago para este artigo</label>
            <select id="paywallOverride">
              <option value="">Usar a regra padrão do site (Configurações)</option>
              <option value="2-paragrafos">Liberar 2 parágrafos, bloquear o resto</option>
              <option value="3-paragrafos">Liberar 3 parágrafos, bloquear o resto</option>
              <option value="50-porcento">Liberar 50% do artigo, bloquear o resto</option>
              <option value="sempre-liberado">Sempre liberado (nunca bloquear, mesmo sem assinatura)</option>
            </select>
          </div>

          <label for="imagem">Imagem de destaque</label>
          <input type="file" id="imagem" accept="image/*">
          <img id="previewImagem" class="preview-imagem" style="display:none;">
          <label for="imagemLegenda">Legenda da imagem (opcional)</label>
          <input type="text" id="imagemLegenda" maxlength="200" placeholder="Ex.: Vista do Monte Sião — Foto: Fulano">

          <div class="form-acoes" id="formAcoes"></div>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script type="module">
    import { protegerPagina, sair, CARGOS } from "../js/auth.js";
    import { criarNoticia, atualizarNoticia, obterNoticia, enviarImagem, STATUS } from "../js/noticias.js";
    import { db } from "../js/firebase-config.js";
    import { enviarImagemCloudinary } from "../js/cloudinary.js";
    import { ativarAutoNegrito } from "../js/versiculos.js";
    import { collection, getDocs, orderBy, query, doc, getDoc, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    let quillEditor = null;

    // Inicializa Quill imediatamente — sem await no topo do modulo
    quillEditor = new Quill('#editorQuill', {
      theme: 'snow',
      placeholder: 'Escreva o texto completo do artigo...',
      modules: {
        toolbar: {
          container: [
            [{ 'header': [2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'align': [] }],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            ['link', 'blockquote', 'image', 'video'],
            ['clean']
          ],
          handlers: {
            image: function() {
              const input = document.createElement('input');
              input.setAttribute('type', 'file');
              input.setAttribute('accept', 'image/*');
              input.click();
              input.onchange = async () => {
                const arquivo = input.files[0];
                if (!arquivo) return;
                const range = quillEditor.getSelection(true) || { index: quillEditor.getLength() };
                quillEditor.insertText(range.index, 'Enviando imagem...', { italic: true });
                try {
                  const url = await enviarImagemCloudinary(arquivo);
                  quillEditor.deleteText(range.index, 'Enviando imagem...'.length);
                  quillEditor.insertEmbed(range.index, 'image', url);
                  quillEditor.setSelection(range.index + 1);
                } catch (e) {
                  quillEditor.deleteText(range.index, 'Enviando imagem...'.length);
                  alert('Erro ao enviar imagem: ' + e.message);
                }
              };
            }
          }
        }
      }
    });

    async function carregarDestaquesSelect(destAtual) {
      const select = document.getElementById('destaque');
      try {
        const snap = await getDocs(query(collection(db, 'destaques'), orderBy('nome')));
        const fixos = snap.empty ? [
          {nome:'NOVO',emoji:'✨'},{nome:'EM ALTA',emoji:'🔥'},{nome:'ESPECIAL',emoji:'📌'},
          {nome:'REFLEXÃO',emoji:'🕊️'},{nome:'ESTUDO',emoji:'📖'},{nome:'TESTEMUNHO',emoji:'🙌'},
          {nome:'EDITORIAL',emoji:'✒️'}
        ] : snap.docs.map(d => d.data());
        fixos.forEach(dest => {
          const opt = document.createElement('option');
          opt.value = dest.nome;
          opt.textContent = (dest.emoji || '') + ' ' + dest.nome;
          if (destAtual === dest.nome) opt.selected = true;
          select.appendChild(opt);
        });
      } catch (e) {}
    }

    async function carregarTagsCheckboxes(tagsAtuais) {
      const container = document.getElementById('containerTags');
      try {
        const snap = await getDocs(query(collection(db, 'tags'), orderBy('nome')));
        if (snap.empty) {
          container.innerHTML = '<p style="font-size:13px;color:#777;">Nenhuma tag ainda. <a href="tags-admin.html" style="color:#E8A33D;font-weight:700;">Criar tags →</a></p>';
          return;
        }
        container.innerHTML = '';
        snap.forEach(d => {
          const tag = d.data();
          const marcado = Array.isArray(tagsAtuais) && tagsAtuais.includes(tag.slug);
          const label = document.createElement('label');
          label.style.cssText = 'display:flex;align-items:center;gap:5px;background:#f4f4f4;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:13px;border:1.5px solid #eee;';
          label.innerHTML = `<input type="checkbox" value="${tag.slug}" style="width:auto;" ${marcado ? 'checked' : ''}> #${tag.nome}`;
          container.appendChild(label);
        });
      } catch (e) { container.innerHTML = ''; }
    }

    async function carregarCategoriasCheckboxes(categoriasAtuais) {
      const container = document.getElementById('containerCategorias');
      try {
        const snap = await getDocs(query(collection(db, 'categorias'), orderBy('ordem')));
        const lista = snap.empty ? [{nome:'Fé',slug:'fe',emoji:'✝️'},{nome:'Estudo Bíblico',slug:'estudo-biblico',emoji:'📖'},{nome:'Devocional',slug:'devocional',emoji:'🕊️'},{nome:'Oração',slug:'oracao',emoji:'🙏'},{nome:'Família',slug:'familia',emoji:'🏠'},{nome:'Juventude',slug:'juventude',emoji:'🌱'},{nome:'Missões',slug:'missoes',emoji:'🌍'},{nome:'Testemunhos',slug:'testemunhos',emoji:'🙌'},{nome:'Vida Cristã',slug:'vida-crista',emoji:'🌿'},{nome:'Reflexão',slug:'reflexao',emoji:'💭'}] : snap.docs.map(d => {
          const cat = d.data();
          return { nome: cat.nome, slug: cat.slug || cat.nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-'), emoji: cat.emoji || '' };
        });

        container.innerHTML = '';
        lista.forEach(cat => {
          const marcado = Array.isArray(categoriasAtuais) ? categoriasAtuais.includes(cat.slug) : categoriasAtuais === cat.slug;
          const label = document.createElement('label');
          label.style.cssText = 'display:flex;align-items:center;gap:6px;background:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;border:1.5px solid #eee;';
          label.innerHTML = `<input type="checkbox" value="${cat.slug}" style="width:auto;" ${marcado ? 'checked' : ''}> ${cat.emoji} ${cat.nome}`;
          label.querySelector('input').addEventListener('change', () => {
            label.style.borderColor = label.querySelector('input').checked ? '#E8A33D' : '#eee';
            label.style.background = label.querySelector('input').checked ? '#f0fff8' : '#fff';
            atualizarCategoriaHidden();
          });
          if (marcado) { label.style.borderColor = '#E8A33D'; label.style.background = '#f0fff8'; }
          container.appendChild(label);
        });
        atualizarCategoriaHidden();
      } catch (e) {
        container.innerHTML = '<p style="color:#b3261e;font-size:13px;">Erro ao carregar categorias.</p>';
      }
    }

    function atualizarCategoriaHidden() {
      const selecionadas = Array.from(document.querySelectorAll('#containerCategorias input:checked')).map(i => i.value);
      document.getElementById('categoria').value = selecionadas[0] || '';
    }

    async function carregarEquipeNaLista() {
      try {
        const snap = await getDocs(collection(db, 'equipe'));
        window.__equipe = snap.docs.map(d => ({ nome: String(d.data().nome || ''), uid: d.data().uid || '' }));
        document.getElementById('listaEquipe').innerHTML = snap.docs.map(d => '<option value="' + String(d.data().nome || '').replace(/"/g, '&quot;') + '">').join('');
      } catch (e) {}
    }
    async function carregarEdicoesNoSelect() {
      window.__equipeP = carregarEquipeNaLista();
      const select = document.getElementById('edicao');
      try {
        const snap = await getDocs(query(collection(db, 'edicoes'), orderBy('criadoEm', 'desc')));
        snap.forEach(d => {
          const ed = d.data();
          if (ed.status !== 'aberta') return; // só edições abertas aceitam artigos
          const opt = document.createElement('option');
          opt.value = ed.nome;
          opt.textContent = ed.nome;
          select.appendChild(opt);
        });
      } catch (e) {}
    }

    let usuarioAtual = null;
    let cargoAtual = null;
    let noticiaIdEdicao = null;
    let imagemAtualUrl = null;

    const params = new URLSearchParams(window.location.search);
    const idParaEditar = params.get('id');

    protegerPagina([CARGOS.ADMIN, CARGOS.EDITOR, CARGOS.COLUNISTA, CARGOS.REVISOR], async (user, cargo) => {
      usuarioAtual = user;
      cargoAtual = cargo;
      if (cargo === CARGOS.REVISOR && !idParaEditar) { window.location.href = 'gerenciar-noticias.html'; return; }
      document.getElementById('cargoAtual').textContent = formatarCargo(cargo);
      montarMenu(cargo);
      montarBotoesAcao(cargo);
      await carregarEdicoesNoSelect();
      await carregarCategoriasCheckboxes([]);
      await carregarTagsCheckboxes([]);
      await carregarDestaquesSelect('');

      if (idParaEditar) {
        noticiaIdEdicao = idParaEditar;
        document.getElementById('tituloPagina').textContent = 'Editar Artigo';
        await carregarNoticia(idParaEditar);
      } else {
        await carregarCategoriasCheckboxes([]);
      }
    });

    function formatarCargo(cargo) {
      const nomes = { administrador: 'Administrador', editor: 'Editor', colunista: 'Colunista', revisor: 'Revisor' };
      return nomes[cargo] || cargo;
    }

    function montarMenu(cargo) {
      const menu = document.getElementById('menuAdmin');
      const itens = [
        { href: 'dashboard.html', label: '📊 Dashboard', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'publicar.html', label: '✍️ Novo Artigo', cargos: ['administrador','editor','colunista'] },
        { href: 'gerenciar-noticias.html', label: '📰 Gerenciar Artigos', cargos: ['administrador','editor','colunista','revisor'] },
        { href: 'categorias-admin.html', label: '🏷️ Categorias', cargos: ['administrador','editor'] },
        { href: 'tags-admin.html', label: '🔖 Tags e Destaques', cargos: ['administrador','editor'] },
        { href: 'edicoes-admin.html', label: '📚 Edições', cargos: ['administrador','editor'] },
        { href: 'conteudo-admin.html', label: '🧩 Conteúdo do site', cargos: ['administrador','editor'] },
        { href: 'estatisticas-admin.html', label: '📈 Estatísticas', cargos: ['administrador','editor'] },
        { href: 'equipe-admin.html', label: '👥 Equipe', cargos: ['administrador'] },
        { href: 'usuarios.html', label: '👤 Usuários', cargos: ['administrador'] },
        { href: 'planos-admin.html', label: '💳 Apoio', cargos: ['administrador'] },
        { href: 'configuracoes.html', label: '⚙️ Configurações', cargos: ['administrador'] },
      ];
      menu.innerHTML = itens.filter(i => i.cargos.includes(cargo)).map(i => `<a href="${i.href}">${i.label}</a>`).join('');
    }

    function montarBotoesAcao(cargo) {
      const acoes = document.getElementById('formAcoes');
      const ehChefe = cargo === CARGOS.ADMIN || cargo === CARGOS.EDITOR;
      function desenhar() {
        const temEdicao = document.getElementById('edicao').value !== '';
        let h = '';
        if (cargo === CARGOS.REVISOR) {
          h = '<button type="button" class="btn-auth" data-acao="aprovar_rev">Salvar correções e aprovar</button>' +
              '<button type="button" class="btn-auth btn-secundario" data-acao="devolver_rev">Devolver ao autor</button>';
        } else {
          h = '<button type="button" class="btn-auth btn-secundario" data-acao="rascunho">Salvar rascunho</button>';
          if (temEdicao) h += '<button type="button" class="btn-auth" data-acao="indexar" style="background:#5c4a00;">Indexar na edição</button>';
          else h += ehChefe ? '<button type="button" class="btn-auth" data-acao="publicar">Publicar</button>'
                            : '<button type="button" class="btn-auth" data-acao="enviar_revisao">Enviar para revisão</button>';
        }
        acoes.innerHTML = h;
        acoes.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => salvarNoticia(btn.dataset.acao)));
      }
      desenhar();
      document.getElementById('edicao').addEventListener('change', function () {
        document.getElementById('edicaoOpcoes').style.display = this.value !== '' ? 'block' : 'none';
        desenhar();
      });
    }

    async function carregarNoticia(id) {
      const noticia = await obterNoticia(id);
      if (!noticia) return;
      document.getElementById('titulo').value = noticia.titulo || '';
      document.getElementById('categoria').value = noticia.categoria || '';
      document.getElementById('resumo').value = noticia.resumo || '';
      document.getElementById('paywallOverride').value = noticia.paywallOverride || '';
      window.__autorUid = noticia.autorUid;
      window.__pares = noticia.coautoresPares || [];
      window.__uidsAntigos = noticia.coautoresUids || [];
      ['coautor1', 'coautor2'].forEach((cid, i) => { const el = document.getElementById(cid); if (el) el.value = (noticia.coautores || [])[i] || ''; });
      if (noticia.edicao) {
        const selEd = document.getElementById('edicao');
        if (!Array.from(selEd.options).some(o => o.value === noticia.edicao)) {
          const o = document.createElement('option'); o.value = noticia.edicao; o.textContent = noticia.edicao + ' (edição já publicada)';
          selEd.appendChild(o);
        }
        selEd.value = noticia.edicao;
        selEd.dispatchEvent(new Event('change'));
        selEd.dispatchEvent(new Event('change'));
        document.getElementById('ordemEdicao').value = noticia.ordemEdicao || 1;
        document.getElementById('gratuito').checked = !!noticia.gratuito;
      }
      setTimeout(() => { quillEditor.root.innerHTML = noticia.conteudo || ''; }, 200);
      const catsAtuais = noticia.categorias || (noticia.categoria ? [noticia.categoria] : []);
      await carregarCategoriasCheckboxes(catsAtuais);
      await carregarDestaquesSelect(noticia.destaque || '');
      await carregarTagsCheckboxes(noticia.tags || []);
      { const lg = document.getElementById('imagemLegenda'); if (lg) lg.value = noticia.imagemLegenda || ''; }
      if (noticia.imagemUrl) {
        imagemAtualUrl = noticia.imagemUrl;
        const preview = document.getElementById('previewImagem');
        preview.src = noticia.imagemUrl;
        preview.style.display = 'block';
      }
    }

    document.getElementById('imagem').addEventListener('change', (e) => {
      const arquivo = e.target.files[0];
      if (!arquivo) return;
      const preview = document.getElementById('previewImagem');
      preview.src = URL.createObjectURL(arquivo);
      preview.style.display = 'block';
    });

    function mostrarErro(texto) {
      const el = document.getElementById('mensagemErro');
      document.getElementById('mensagemSucesso').style.display = 'none';
      el.textContent = texto; el.style.display = 'block';
    }

    function mostrarSucesso(texto) {
      const el = document.getElementById('mensagemSucesso');
      document.getElementById('mensagemErro').style.display = 'none';
      el.textContent = texto; el.style.display = 'block';
    }

    ativarAutoNegrito(quillEditor);


    async function salvarNoticia(acao) {
      const titulo = document.getElementById('titulo').value.trim();
      const resumo = document.getElementById('resumo').value.trim();
      const conteudoHtml = quillEditor.root.innerHTML;
      const conteudo = conteudoHtml;
      const categoriasSelecionadas = Array.from(document.querySelectorAll('#containerCategorias input:checked')).map(i => i.value);
            const categoria = categoriasSelecionadas[0] || '';
      const destaque = document.getElementById('destaque')?.value || '';
      const tagsSelecionadas = Array.from(document.querySelectorAll('#containerTags input:checked')).map(i => i.value);
      document.getElementById('categoria').value = categoria;
      const edicao = document.getElementById('edicao').value;
      const coautores = ['coautor1', 'coautor2'].map(i => (document.getElementById(i) || { value: '' }).value.trim()).filter(Boolean).slice(0, 2);
      await window.__equipeP;
      const autorPrincipal = window.__autorUid || usuarioAtual.uid;
      const pares = coautores.map(nm => {
        const k = nm.toLowerCase();
        const m = (window.__pares || []).find(x => x.nome.toLowerCase() === k) || (window.__equipe || []).find(x => x.nome.toLowerCase() === k);
        return { nome: nm, uid: m && m.uid ? m.uid : '' };
      });
      const semLista = !(window.__equipe || []).length && !(window.__pares || []).length && coautores.length;
      const coautoresUids = semLista ? (window.__uidsAntigos || []) : [...new Set(pares.map(x => x.uid).filter(u => u && u !== autorPrincipal))];
      let gratuito = edicao ? document.getElementById('gratuito').checked : true;
      const paywallOverride = document.getElementById('paywallOverride').value;
      let ordemEdicao = parseInt(document.getElementById('ordemEdicao')?.value) || 1;
      const arquivoImagem = document.getElementById('imagem').files[0];

      const textoPuro = quillEditor.getText().trim();
      if (!titulo) { mostrarErro('Escreva ao menos o título para salvar.'); return; }
      if (acao !== 'rascunho' && !textoPuro) { mostrarErro('Escreva algum texto no artigo antes de continuar.'); return; }
      if (acao === 'indexar' && !edicao) { mostrarErro('Escolha uma edição aberta para indexar o artigo.'); return; }
      if (acao === 'publicar' && !categoria) { mostrarErro('Selecione pelo menos uma categoria para publicar.'); return; }

      let status = STATUS.RASCUNHO;
      if (acao === 'enviar_revisao') status = STATUS.EM_REVISAO;
      if (acao === 'publicar') status = STATUS.PUBLICADO;
      if (acao === 'indexar') status = (cargoAtual === CARGOS.ADMIN || cargoAtual === CARGOS.EDITOR) ? 'indexado' : STATUS.EM_REVISAO;
      if (acao === 'aprovar_rev') status = STATUS.APROVADO;
      if (acao === 'devolver_rev') status = STATUS.DEVOLVIDO;

      try {
        let idNoticia = noticiaIdEdicao;
        let cargoEditorialAutor = '';
        try {
          const snapUsuario = await getDoc(doc(db, 'usuarios', usuarioAtual.uid));
          if (snapUsuario.exists()) cargoEditorialAutor = snapUsuario.data().cargoEditorial || '';
        } catch (e) {}

        if (!idNoticia) {
          idNoticia = await criarNoticia(
            { titulo, categoria, categorias: categoriasSelecionadas, destaque, tags: tagsSelecionadas, resumo, conteudo, status, imagemUrl: imagemAtualUrl, edicao, gratuito, paywallOverride, ordemEdicao, cargoEditorialAutor },
            usuarioAtual.uid, usuarioAtual.displayName || usuarioAtual.email
          );
        }

        let imagemUrl = imagemAtualUrl;
        if (arquivoImagem) imagemUrl = await enviarImagem(arquivoImagem, idNoticia);

        await atualizarNoticia(idNoticia, { titulo, categoria, categorias: categoriasSelecionadas, destaque, tags: tagsSelecionadas, resumo, conteudo, status, coautores, coautoresUids, coautoresPares: pares, imagemUrl, imagemLegenda: (document.getElementById('imagemLegenda') || {}).value || '', edicao, gratuito, paywallOverride, ordemEdicao });

        if (status === STATUS.PUBLICADO) {
        }

        noticiaIdEdicao = idNoticia;
        document.getElementById('tituloPagina').textContent = 'Editar Artigo';
        const urlAtual = new URL(window.location.href);
        urlAtual.searchParams.set('id', idNoticia);
        window.history.replaceState({}, '', urlAtual.toString());
        const horas = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        if (acao === 'rascunho') {
          mostrarSucesso('✓ Rascunho salvo às ' + horas + '. Você pode continuar escrevendo ou encontrá-lo depois em Gerenciar Artigos → Rascunhos.');
          document.getElementById('mensagemSucesso').insertAdjacentHTML('beforeend', ' <a href="gerenciar-noticias.html?aba=rascunho">Ver rascunhos</a>');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          const textos = {
            indexar: status === 'indexado' ? 'Artigo indexado na edição "' + edicao + '".' : 'Artigo indexado na edição "' + edicao + '" e enviado para aprovação.',
            enviar_revisao: 'Artigo enviado para revisão.', publicar: 'Artigo publicado.',
            aprovar_rev: 'Correções salvas e artigo aprovado.', devolver_rev: 'Artigo devolvido ao autor.'
          };
          mostrarSucesso('✓ ' + (textos[acao] || 'Artigo salvo.'));
          window.scrollTo({ top: 0, behavior: 'smooth' });
          setTimeout(() => window.location.href = 'gerenciar-noticias.html?aba=' + status, 1800);
        }
      } catch (err) {
        mostrarErro('Erro ao salvar o artigo. Verifique sua permissão e tente novamente.');
        console.error(err);
      }
    }

    document.getElementById('btnSair').addEventListener('click', async () => {
      await sair(); window.location.href = '../login.html';
    });
  </script>
<script src="../js/dica-imagem.js"></script>
</body>
